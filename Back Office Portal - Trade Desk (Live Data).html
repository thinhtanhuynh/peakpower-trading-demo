<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakPower — Back Office Trade desk (Live Data)</title>
<style>
:root {
    --pp-bg:#eef2f6; --pp-surface:#ffffff; --pp-surface-alt:#f8fafc; --pp-surface-zebra:#fbfdff;
    --pp-border:#dbe3ec; --pp-border-strong:#c3cede;
    --pp-text-heading:#0f172a; --pp-text-body:#64748b; --pp-text-faint:#94a3b8;
    --pp-sidebar-bg:#0f2b33; --pp-sidebar-text:#cbd5e1; --pp-sidebar-text-active:#ffffff;
    --pp-sidebar-subtitle:#5eead4; --pp-sidebar-active-bg:rgba(20,184,166,0.16);
    --pp-teal-900:#0f2b33; --pp-teal-700:#0f766e; --pp-teal-600:#0d9488; --pp-teal-500:#14b8a6;
    --pp-teal-300:#5eead4; --pp-teal-100:#ccfbf1;
    --pp-indigo:#4f46e5; --pp-indigo-bg:#e0e7ff;
    --pp-orange:#ea580c; --pp-cyan:#0891b2;
    --pp-amber:#d97706; --pp-amber-bg:#fef3c7; --pp-amber-border:#fcd34d; --pp-amber-text:#92400e;
    --pp-green:#15803d; --pp-green-bg:#dcfce7; --pp-green-border:#86efac; --pp-green-text:#166534;
    --pp-red:#dc2626; --pp-red-bg:#fee2e2; --pp-red-border:#fca5a5; --pp-red-text:#991b1b;
    --font-sans:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --font-mono:'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
    --text-2xs:10px; --text-xs:11px; --text-sm:12.5px; --text-base:13.5px; --text-md:15px; --text-lg:17px; --text-xl:23px; --text-display:44px;
    --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
    --tracking-eyebrow:0.05em;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
    --radius-sm:5px; --radius-md:7px; --radius-lg:10px; --radius-pill:999px;
    --sidebar-width:218px; --topbar-height:56px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--font-sans); background: var(--pp-bg); color: var(--pp-text-heading); }
  .app { display:flex; height:100vh; width:100%; overflow:hidden; }
  .sidebar { width:var(--sidebar-width); min-width:var(--sidebar-width); background:var(--pp-sidebar-bg); color:var(--pp-sidebar-text); display:flex; flex-direction:column; padding:20px 0; }
  .sidebar .brand { padding:0 20px 20px; font-size:11px; letter-spacing:var(--tracking-eyebrow); color:var(--pp-sidebar-subtitle); font-weight:700; text-transform:uppercase; }
  .sidebar nav { display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .sidebar nav a { display:block; padding:9px 12px; border-radius:7px; font-size:13px; color:var(--pp-sidebar-text); text-decoration:none; cursor:pointer; transition:background-color .15s ease, color .15s ease; }
  .sidebar nav a:hover:not(.active) { background:rgba(255,255,255,0.07); color:var(--pp-sidebar-text-active); }
  .sidebar nav a.active { background:var(--pp-sidebar-active-bg); color:var(--pp-sidebar-text-active); font-weight:600; }
  .sidebar-footer { margin-top:auto; padding:14px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:var(--pp-sidebar-text); }
  .sidebar-footer span { display:block; margin-top:2px; font-size:10.5px; color:#5b7480; }
  .main { flex:1; display:flex; flex-direction:column; overflow:auto; }
  .topbar { height:var(--topbar-height); min-height:var(--topbar-height); background:#fff; border-bottom:1px solid var(--pp-border); display:flex; align-items:center; justify-content:space-between; padding:0 28px; position:sticky; top:0; z-index:5; gap:16px; }
  .topbar .crumb { font-size:11px; color:var(--pp-text-body); }
  .topbar .crumb .crumb-back { color:var(--pp-text-heading); font-weight:600; cursor:pointer; }
  .topbar .crumb .crumb-back:hover { color:var(--pp-teal-700); }
  .topbar .title { font-size:var(--text-lg); font-weight:700; color:var(--pp-text-heading); margin-top:2px; }
  .topbar .subtitle { font-size:11px; color:var(--pp-text-body); }
  .topbar-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  /* Badge — matches PeakPowerDesignSystem Badge.jsx exactly (11px/600,
     4px 12px, and every tone carries a real 1px border). */
  .badge { display:inline-block; padding:4px 12px; border-radius:var(--radius-pill); font-size:11px; font-weight:600; line-height:1.2; border:1px solid transparent; white-space:nowrap; }
  .badge.info { background:var(--pp-indigo-bg); color:#4338ca; border-color:#c7d2fe; }
  .badge.success { background:var(--pp-green-bg); color:var(--pp-green-text); border-color:var(--pp-green-border); }
  .badge.warning { background:var(--pp-amber-bg); color:var(--pp-amber-text); border-color:var(--pp-amber-border); }
  .badge.critical { background:var(--pp-red-bg); color:var(--pp-red-text); border-color:var(--pp-red-border); }
  .badge.brand { background:var(--pp-teal-100); color:var(--pp-teal-700); border-color:var(--pp-teal-300); }
  .badge.neutral { background:var(--pp-surface-alt); color:var(--pp-text-body); border-color:var(--pp-border-strong); }
  /* Screens this page doesn't implement use the Back Office mockup's own
     placeholder treatment, verbatim (it has an `isPlaceholder` screen for
     exactly this). The nav itself stays fully navigable, as in the mockup. */
  .placeholder { background:#fff; border:1px solid var(--pp-border); border-radius:10px; padding:48px 24px; text-align:center; color:var(--pp-text-body); font-size:13px; }
  .content { padding:28px; }
  .page { display:none; flex-direction:column; gap:16px; }
  .page.active { display:flex; animation:pp-fade-in .18s ease; }
  @keyframes pp-fade-in { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
  /* Every screen renders into one #desk-body wrapper, so the wrapper carries
     the section gap — .page has a single child (see CLAUDE.md). Each of the
     mockup's screens wraps itself in `padding:28px; flex-direction:column;
     gap:N`; .content supplies the padding, and this supplies the gap. The
     mockup uses 20px on Home and the trade detail, 16px everywhere else. */
  #desk-body { display:flex; flex-direction:column; gap:16px; }
  #desk-body.gap-20 { gap:20px; }
  /* Card — matches PeakPowerDesignSystem Card.jsx. Note the head's own
     margin-bottom is 14px, dropping to 4px when a subtitle follows it (the
     subtitle is a SIBLING of the head in the DS, not a child, and carries the
     remaining 14px itself). */
  .card { background:#fff; border:1px solid var(--pp-border); border-radius:var(--radius-lg); padding:18px 20px; }
  .card .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .card .card-head.has-subtitle { margin-bottom:4px; }
  .card .card-title { font-size:13.5px; font-weight:700; color:var(--pp-text-heading); }
  .card .card-subtitle { font-size:11.5px; color:var(--pp-text-body); margin-bottom:14px; }
  /* StatCard — matches StatCard.jsx, including its amber `highlight` variant. */
  .stat-row { display:flex; gap:16px; flex-wrap:wrap; }
  /* No flex-grow: StatCard.jsx sets only min-width, so the mockup's stat rows
     size to content and pack left rather than stretching edge to edge. */
  .stat-card { background:#fff; border:1px solid var(--pp-border); border-radius:var(--radius-lg); padding:14px 16px; min-width:160px; }
  .stat-card.highlight { background:var(--pp-amber-bg); border-color:var(--pp-amber-border); }
  .stat-card .label { font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--pp-text-body); text-transform:uppercase; }
  .stat-card .value { font-size:23px; font-weight:700; margin-top:8px; color:var(--pp-text-heading); }
  .stat-card .value.critical { color:var(--pp-orange); }
  .stat-card .value.warning { color:var(--pp-amber); }
  .stat-card .value.success { color:var(--pp-green); }
  .stat-card .value.brand { color:var(--pp-teal-600); }
  .stat-card .sublabel { font-size:11px; color:var(--pp-text-faint); margin-top:6px; }
  
.btn-primary, .btn-secondary { display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius-md); padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-sans); border:1px solid; transition:background .15s ease, border-color .15s ease; }
  .btn-primary { background:var(--pp-teal-600); border-color:var(--pp-teal-600); color:#fff; }
  .btn-primary:hover:not(:disabled) { background:var(--pp-teal-700); border-color:var(--pp-teal-700); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary { background:#fff; border-color:var(--pp-border-strong); color:var(--pp-text-heading); }
  .btn-secondary:hover:not(:disabled) { background:var(--pp-surface-alt); }
  .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sm { padding:7px 14px; font-size:12px; }
  
.banner { display:flex; align-items:center; gap:12px; border-radius:var(--radius-lg); padding:12px 16px; font-size:12.5px; }
  .banner-amber { background:var(--pp-amber-bg); border:1px solid var(--pp-amber-border); color:var(--pp-amber-text); }
  .banner-teal { background:var(--pp-teal-100); border:1px solid var(--pp-teal-300); color:var(--pp-teal-900); }
  .banner-icon { width:22px; height:22px; border-radius:50%; background:var(--pp-amber); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .banner-body { flex:1; }
  /* The DS Banner proper (Banner.jsx): 14px/18px padding, 14px gap, a coloured
     22px dot, a 13/700 title and an 11.5px body. `.banner` above is this page's
     own lighter one-line variant, kept as-is for the Trade desk. */
  .ds-banner { display:flex; align-items:center; gap:14px; border-radius:var(--radius-lg); padding:14px 18px; }
  .ds-banner .db-dot { width:22px; height:22px; min-width:22px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .ds-banner .db-title { font-size:13px; font-weight:700; }
  .ds-banner .db-body { font-size:11.5px; margin-top:3px; }
  .ds-banner.critical { background:var(--pp-red-bg); border:1px solid var(--pp-red-border); color:var(--pp-red-text); }
  .ds-banner.critical .db-dot { background:var(--pp-red); }
  .ds-banner.warning { background:var(--pp-amber-bg); border:1px solid var(--pp-amber-border); color:var(--pp-amber-text); }
  .ds-banner.warning .db-dot { background:var(--pp-amber); }
  .ds-banner.info { background:var(--pp-teal-100); border:1px solid var(--pp-teal-300); color:var(--pp-teal-700); }
  .ds-banner.info .db-dot { background:var(--pp-teal-600); }

  /* --- Trade desk ------------------------------------------------------- */
  .desk-columns { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .desk-column { flex:1; min-width:280px; }
  .desk-queue { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .desk-empty { font-size:12px; color:var(--pp-text-faint); padding:18px 0; }

  /* Card geometry ported from the Back Office mockup's queue cards. */
  .desk-card { cursor:pointer; background:#fff; border:1px solid var(--pp-border); border-radius:8px; padding:14px 16px; transition:border-color .15s ease, box-shadow .15s ease; }
  .desk-card:hover { border-color:var(--pp-border-strong); }
  .desk-card.urgent { background:var(--pp-red-bg); border-color:var(--pp-red-border); }
  /* A request that arrived from the Customer Portal in this session. */
  .desk-card.live { background:var(--pp-teal-100); border-color:var(--pp-teal-300); }
  .desk-card.flash { animation:desk-flash 1.4s ease; }
  @keyframes desk-flash { 0% { box-shadow:0 0 0 0 rgba(20,184,166,.55); } 100% { box-shadow:0 0 0 14px rgba(20,184,166,0); } }

  .desk-card .dc-top { display:flex; justify-content:space-between; align-items:center; }
  .desk-card .dc-id { font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--pp-teal-600); }
  .desk-card .dc-tag { font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:5px; border:1px solid; }
  .desk-card .dc-customer { font-size:12.5px; font-weight:600; color:var(--pp-text-heading); margin-top:8px; }
  .desk-card .dc-line { display:flex; justify-content:space-between; align-items:baseline; margin-top:2px; }
  .desk-card .dc-meta { font-size:11px; color:var(--pp-text-body); }
  .desk-card .dc-value { font-size:12px; font-weight:700; color:var(--pp-text-heading); }
  .desk-card .dc-action { font-size:10px; font-weight:600; color:var(--pp-teal-600); margin-top:10px; }
  .desk-card .dc-confirm { margin-top:10px; }
  .desk-card .dc-confirm button { width:100%; justify-content:center; }

  .desk-note { background:var(--pp-surface-alt); border:1px solid var(--pp-border-strong); border-radius:8px; padding:12px 16px; font-size:12px; color:var(--pp-text-body); }

  /* --- Request detail ---------------------------------------------------- */
  .detail-grid { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .detail-main { flex:1.55; min-width:520px; display:flex; flex-direction:column; gap:20px; }
  .detail-side { flex:1; min-width:260px; display:flex; flex-direction:column; gap:20px; }
  .kv-row { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; }
  .kv-row .k { color:var(--pp-text-body); }
  .kv-row .v { font-weight:600; text-align:right; }
  .kv-row .v.mono { font-family:var(--font-mono); font-weight:500; font-size:11.5px; }
  .grid-table { border:1px solid var(--pp-border); border-radius:var(--radius-lg); overflow:hidden; background:#fff; }
  .gt-head { display:grid; background:var(--pp-surface-alt); font-size:10px; font-weight:700; color:var(--pp-text-body); letter-spacing:.03em; padding:9px 12px; gap:10px; border-bottom:1px solid var(--pp-border); }
  .gt-row { display:grid; padding:11px 12px; font-size:12px; color:var(--pp-text-heading); border-top:1px solid var(--pp-border); align-items:center; gap:10px; }
  .gt-head + .gt-row { border-top:none; }
  .gt-num { text-align:right; }
  .gt-sub { font-size:10px; color:var(--pp-text-faint); font-family:var(--font-mono); }
  /* --- Pricing form ------------------------------------------------------ */
  .price-form { display:flex; flex-direction:column; gap:14px; }
  .price-form .pf-row { display:flex; flex-direction:column; gap:6px; }
  .price-form .pf-label { font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--pp-text-body); text-transform:uppercase; }
  .price-form .pf-input { border:1.5px solid var(--pp-teal-600); border-radius:var(--radius-md); padding:9px 12px; font-size:13px; font-weight:600; font-family:var(--font-mono); color:var(--pp-teal-700); background:#fff; width:100%; }
  .price-form .pf-input:focus { outline:none; box-shadow:0 0 0 3px rgba(20,184,166,0.15); }
  .price-form .pf-total { font-size:12px; color:var(--pp-text-body); background:var(--pp-surface-alt); border:1px solid var(--pp-border); border-radius:var(--radius-md); padding:10px 12px; }
  .price-form .pf-total strong { color:var(--pp-text-heading); font-size:13.5px; }
  .price-form .pf-error { font-size:11.5px; color:var(--pp-red); min-height:14px; }
  .price-form .pf-actions { display:flex; gap:10px; }

  .crumb-back { cursor:pointer; color:var(--pp-teal-600); font-weight:600; }
  .crumb-back:hover { text-decoration:underline; }
  .empty-note { font-size:12.5px; color:var(--pp-text-body); }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Back office</div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">M. Bakker<span>Trading</span></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <div class="title" id="page-title">Trade desk</div>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content">
      <div class="page active" id="page-desk">
        <div id="desk-body"></div>
      </div>
    </div>
  </div>
</div>

<script src="portal-trade-link.js"></script>
<script src="back-office-desk-data.js"></script>
<script src="back-office-screens-data.js"></script>
<script>
(function () {
  "use strict";

  var D = BackOfficeDeskData;
  var Link = PortalTradeLink;

  var S = BackOfficeScreensData;

  var state = {
    page: "Trade desk",    // which nav entry is showing
    view: "list",          // "list" | "detail" (Trade desk only)
    tradeId: null,
    confirmedSeedIds: {},  // seeded To-confirm rows cleared on this page
    requests: [],          // live requests published by the Customer Portal
    flashIds: {},          // ids to pulse once, so a new arrival is noticeable
    expiredShown: {},      // ids already re-rendered at the moment of expiry
    customerId: null,      // open customer on the Customers screen
    commercialEditing: false,
    commercialFields: S.COMMERCIAL_FIELDS.slice(),
    commercialSnapshot: null   // pre-edit copy, so Cancel can actually cancel
  };

  var deskBody = document.getElementById("desk-body");
  var crumb = document.getElementById("crumb");
  var pageTitle = document.getElementById("page-title");
  var pageSubtitle = document.getElementById("page-subtitle");
  var topbarActions = document.getElementById("topbar-actions");

  // --- helpers --------------------------------------------------------------

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function badge(text, tone) { return '<span class="badge ' + tone + '">' + esc(text) + "</span>"; }
  /** The DS Card: head (title + action), then the subtitle as its sibling. */
  function cardHtml(title, subtitle, body, action) {
    return '<div class="card">' +
      '<div class="card-head' + (subtitle ? " has-subtitle" : "") + '">' +
        '<div><div class="card-title">' + esc(title) + "</div></div>" + (action || "") +
      "</div>" +
      (subtitle ? '<div class="card-subtitle">' + esc(subtitle) + "</div>" : "") +
      body + "</div>";
  }

  /** The DS StatCard. `tone` colours the value; `highlight` tints the card. */
  function statCard(label, value, tone, sublabel, highlight) {
    return '<div class="stat-card' + (highlight ? " highlight" : "") + '">' +
      '<div class="label">' + esc(label) + "</div>" +
      '<div class="value' + (tone && tone !== "default" ? " " + tone : "") + '">' + esc(value) + "</div>" +
      (sublabel ? '<div class="sublabel">' + esc(sublabel) + "</div>" : "") +
      "</div>";
  }

  /**
   * A DS Card `action` slot that is just a label ("41 · showing 5", "last 24 h").
   * The mockup passes a bare string, which Card.jsx drops into the head with no
   * styling — so it inherits 16px next to a 13.5px title, plainly unintended.
   * It gets the card subtitle's type here instead, consistently across screens.
   */
  function cardAction(text) {
    return '<span style="font-size:11.5px;color:var(--pp-text-body)">' + esc(text) + "</span>";
  }

  /** The DS Banner (Banner.jsx), distinct from this page's lighter `.banner`. */
  function dsBanner(tone, title, body, actionHtml) {
    return '<div class="ds-banner ' + tone + '">' +
      (title ? '<div class="db-dot">!</div>' : "") +
      '<div style="flex:1">' +
        (title ? '<div class="db-title">' + esc(title) + "</div>" : "") +
        (body ? '<div class="db-body">' + esc(body) + "</div>" : "") +
      "</div>" + (actionHtml || "") + "</div>";
  }

  function noop() {}

  /**
   * The topbar, driven by one chrome object per screen — the shape the mockup's
   * own renderVals() computes (topTitle / topSubtitle / hasCrumb+backLabel+
   * crumbRest / topActions). Crumb and subtitle are mutually exclusive in the
   * mockup: a list screen has a subtitle, a detail screen has a crumb.
   *
   *   { title, subtitle, crumb: {backLabel, backFn, rest} | null,
   *     actions: [{ label, variant, onClick }] }
   */
  function applyChrome(c) {
    pageTitle.textContent = c.title || "";
    pageSubtitle.textContent = c.subtitle || "";
    crumb.innerHTML = c.crumb
      ? '<span class="crumb-back" onclick="' + c.crumb.backFn + '">' + esc(c.crumb.backLabel) + "</span> › " + esc(c.crumb.rest)
      : "";
    topbarActions.innerHTML = (c.actions || []).map(function (a) {
      return '<button type="button" class="btn-' + (a.variant === "primary" ? "primary" : "secondary") +
        '" onclick="' + (a.onClick || "BO.noop()") + '">' + esc(a.label) + "</button>";
    }).join("");
  }

  /**
   * All live requests as desk cards, newest-first handled by buildQueues.
   * Note the explicit wrapper: passing `Link.toDeskCard` straight to map()
   * would hand it the array index as its `now` argument, pinning every
   * countdown to the epoch.
   */
  function liveCards() {
    return state.requests.map(function (r) { return Link.toDeskCard(r); });
  }

  /** The seeded rows still on the desk (confirmed ones are cleared out). */
  function seedRows() {
    return D.TRADES.filter(function (t) { return !state.confirmedSeedIds[t.id]; });
  }

  function findCard(id) {
    var all = D.buildQueues(liveCards(), seedRows());
    for (var q = 0; q < all.length; q++) {
      for (var i = 0; i < all[q].trades.length; i++) {
        if (all[q].trades[i].id === id) { return all[q].trades[i]; }
      }
    }
    return null;
  }

  // --- list view ------------------------------------------------------------

  function deskCardHtml(t) {
    var tone = D.TAG_STYLE[t.tagTone] || D.TAG_STYLE.neutral;
    var cls = "desk-card" + (t.live ? " live" : (t.urgent ? " urgent" : "")) +

  // --- pricing --------------------------------------------------------------

  /** Parses an NL-or-plain decimal ("94,75" or "94.75") into a number. */
  function parsePrice(raw) {
    var s = String(raw == null ? "" : raw).trim().replace(/\s/g, "");
    if (!s) { return NaN; }
    // "1.234,56" -> "1234.56";  "94.75" -> "94.75"
    if (s.indexOf(",") > -1) { s = s.replace(/\./g, "").replace(",", "."); }
    return parseFloat(s);
  }

  function priceFormValues() {
    var priceEl = document.getElementById("price-input");
    var winEl = document.getElementById("window-input");
    return {
      price: parsePrice(priceEl && priceEl.value),
      minutes: winEl ? parseInt(winEl.value, 10) : Link.DEFAULT_REACTION_MINUTES
    };
  }

  /** Live total + validation as the desk types. */
  function updatePriceTotal() {
    var req = (findCard(state.tradeId) || {}).request;
    if (!req) { return; }
    var v = priceFormValues();
    var totalEl = document.getElementById("price-total");
    var errEl = document.getElementById("price-error");
    var btn = document.getElementById("send-offer");
    if (!totalEl || !btn) { return; }

    var priceOk = isFinite(v.price) && v.price > 0;
    var winOk = isFinite(v.minutes) && v.minutes >= 1 && v.minutes <= 240;
    totalEl.innerHTML = priceOk
      ? "Total value <strong>€ " + Link.formatNL(v.price * req.volumeMwh, 2) + "</strong> for " +
        Link.formatMwh(req.volumeMwh)
      : "Enter a price to see the total value.";
    errEl.textContent = !priceOk && document.getElementById("price-input").value.trim()
      ? "Enter a price greater than zero."
      : (!winOk ? "Reaction window must be between 1 and 240 minutes." : "");
    btn.disabled = !(priceOk && winOk);
  }

  function onPriceInput() { updatePriceTotal(); }

  function sendOffer() {
    var card = findCard(state.tradeId);
    if (!card || !card.request) { return; }
    var v = priceFormValues();
    var priced = Link.priceRequest(card.request, {
      priceMwh: v.price,
      reactionMinutes: v.minutes,
      pricedBy: BackOfficeDeskData.USER_LINE
    });
    if (!priced) { return updatePriceTotal(); }
    try {
      Link.publish(window.localStorage, priced);
    } catch (e) {
      console.warn("Offer not published to the Customer Portal:", e);
    }
    state.requests = Link.read(window.localStorage);
    render();
  }

  function dfLegendItem(l) {
    return '<div style="display:flex;align-items:center;gap:6px">' +
      '<div style="width:12px;height:10px;border-radius:2px;background:' + esc(l.color) + '"></div>' +
      '<span style="font-size:11px;color:var(--pp-text-body)">' + esc(l.label) + "</span>" +
      "</div>";
  }

  var DF_MESSAGE_COLS = "0.9fr 1.2fr 1.4fr 0.7fr 1fr 1.7fr";

  function dfMessageRow(m) {
    return '<div style="display:grid;grid-template-columns:' + DF_MESSAGE_COLS +
        ';gap:10px;padding:10px 12px;font-size:12px;border-top:1px solid var(--pp-border);align-items:center">' +
        "<div>" + esc(m.received) + "</div>" +
        "<div>" + esc(m.type) + "</div>" +
        '<div style="font-family:var(--font-mono);font-size:11px">' + esc(m.docId) + "</div>" +
        '<div style="text-align:right">' + esc(m.series) + "</div>" +
        "<div>" + badge(m.statusLabel, m.statusTone) + "</div>" +
        '<div style="color:' + esc(m.detailColor) + '">' + esc(m.detail) + "</div>" +
      "</div>";
  }

  function renderDataFeeds() {
    var stats =
      '<div style="display:flex;flex-wrap:wrap;gap:14px">' +
        dfStatCard("DOCUMENTS TODAY", "412", "success", "all acknowledged < 1 s") +
        dfStatCard("PROCESSING LAG", "42 s", "success", "p95 · target < 5 min") +
        dfStatCard("FAILED", "2", "warning", "both validation errors") +
        dfStatCard("QUARANTINED", "1", "warning", "EAN not registered") +
        dfStatCard("SILENT CONNECTIONS", "3", "critical", "no data for 3+ days") +
      "</div>";

    var connections = buildConnections();
    var stateBody =
      '<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">' +
        connections.map(dfConnectionRow).join("") +
      "</div>" +
      '<div style="display:flex;gap:22px;margin-top:16px">' +
        LEGEND.map(dfLegendItem).join("") +
      "</div>";
    var stateCard = cardHtml(
      "Data state per connection",
      "last 21 delivery dates · all customers",
      stateBody,
      cardAction("Silent first ▾")
    );

    var messagesBody =
      '<div style="border:1px solid var(--pp-border);border-radius:8px;overflow:hidden;margin-top:4px">' +
        '<div style="display:grid;grid-template-columns:' + DF_MESSAGE_COLS +
          ';gap:10px;padding:9px 12px;background:var(--pp-surface-alt);font-size:10px;font-weight:700;color:var(--pp-text-body);letter-spacing:.03em">' +
          "<div>RECEIVED</div><div>TYPE</div><div>DOCUMENT ID</div>" +
          '<div style="text-align:right">SERIES</div><div>STATUS</div><div>DETAIL</div>' +
        "</div>" +
        MESSAGES.map(dfMessageRow).join("") +
      "</div>";

    var quarantineBody =
      '<div style="background:var(--pp-amber-bg);border:1px solid var(--pp-amber-border);border-radius:8px;padding:14px 16px;margin-top:4px">' +
        '<div style="font-size:12.5px;font-weight:700;color:#92400e">EAN 8716 8710 0000 0006 44</div>' +
        '<div style="font-size:11px;color:#92400e;margin-top:8px">Consumption + production, 12 Aug 2026</div>' +
        '<div style="font-size:11px;color:#92400e;margin-top:6px">192 points held · first seen 3 days ago</div>' +
        '<div style="font-size:10.5px;color:#b45309;margin-top:10px">Sender GLN matches PVNed. Likely a new connection.</div>' +
      "</div>" +
      '<div style="display:flex;gap:12px;margin-top:14px">' +
        '<button type="button" class="btn-primary" onclick="BO.noop()">Register EAN</button>' +
        '<button type="button" class="btn-secondary" onclick="BO.noop()">Assign to customer</button>' +
      "</div>" +
      '<div style="font-size:10.5px;color:var(--pp-text-faint);margin-top:14px">Resolving the EAN replays the held series automatically.</div>';

    var bottom =
      '<div style="display:flex;gap:16px;align-items:flex-start">' +
        '<div style="flex:1.7">' +
          cardHtml("Inbound messages", "", messagesBody, cardAction("last 24 h")) +
        "</div>" +
        '<div style="flex:1">' +
          cardHtml("Quarantine", "never discarded", quarantineBody) +
        "</div>" +
      "</div>";

    // The mockup's screen root is `padding:28px;display:flex;flex-direction:
    // column;gap:16px`; the padding is dropped here because this page's
    // `.content` already supplies it.
    return '<div style="display:flex;flex-direction:column;gap:16px">' +
      stats + stateCard + bottom + "</div>";
  }

  /** renderVals()'s `s.page === 'Data & feeds'` branch, verbatim. */
  function dataFeedsChrome() {
    return {
      title: "Data & feeds",
      subtitle: "PVNed ingestion · 412 documents today · 1 quarantined",
      crumb: null,
      actions: [{ label: "Replay message", variant: "secondary", onClick: "BO.noop()" }]
    };
  }

  // ===== END generated screens =====

  // --- navigation -----------------------------------------------------------

  function renderSidebar() {
    document.getElementById("sidebar-nav").innerHTML = D.NAV.map(function (n) {
      return '<a href="#"' + (n === state.page ? ' class="active"' : "") +
        ' onclick="BO.goTo(\'' + esc(n) + '\'); return false">' + esc(n) + "</a>";
    }).join("");
  }

  function goTo(page) {
    state.page = page;
    // Leaving a screen drops its open detail, so coming back lands on the list
    // rather than a stale record — the mockup's own goTo() does the same.
    if (page !== "Trade desk") { state.view = "list"; state.tradeId = null; }
    if (page !== "Customers") { closeCustomerDetail(true); }
    renderSidebar();
    render();
  }

  // --- Customers ------------------------------------------------------------

  function selectCustomer(kvk) {
    state.customerId = kvk;
    state.commercialEditing = false;
    render();
  }
  function closeCustomerDetail(quiet) {
    state.customerId = null;
    state.commercialEditing = false;
    state.commercialSnapshot = null;
    if (!quiet) { render(); }
  }

  /**
   * Commercial-terms editing.
   *
   * One deliberate divergence from the mockup: there, `cancelCommercialEdit()`
   * and `saveCommercialEdit()` are the same one-line stub, so Cancel keeps every
   * keystroke — the button does not do what it says. Here Cancel restores the
   * snapshot taken when editing started, which is what the control claims to do.
   */
  function startCommercialEdit() {
    state.commercialSnapshot = state.commercialFields.map(function (f) { return f; });
    state.commercialEditing = true;
    render();
  }
  function cancelCommercialEdit() {
    if (state.commercialSnapshot) { state.commercialFields = state.commercialSnapshot; }
    state.commercialSnapshot = null;
    state.commercialEditing = false;
    render();
  }
  function saveCommercialEdit() {
    state.commercialSnapshot = null;
    state.commercialEditing = false;
    render();
  }

  /**
   * Deliberately does NOT re-render: a re-render rebuilds the <input> under the
   * cursor and steals focus mid-keystroke. The read-only view is rebuilt on
   * Save instead, which is the only place the new value is shown.
   */
  function updateCommercialField(i, numeric) {
    var fields = state.commercialFields.slice();
    var f = fields[i];
    if (!f) { return; }
    var next = { label: f.label, color: f.color, money: f.money, numeric: numeric };
    if (f.money) {
      next.prefix = f.prefix; next.suffix = f.suffix;
      next.value = f.prefix + numeric + f.suffix;
    } else {
      next.value = numeric;
    }
    fields[i] = next;
    state.commercialFields = fields;
  }

  /**
   * The mockup's own placeholder screen, word for word. It applies to exactly
   * the two entries the mockup itself leaves unbuilt (`isPlaceholder` is
   * `page === 'Reference data' || page === 'Audit'`) — every other nav entry is
   * a real screen here, as it is there.
   */
  function renderPlaceholder() {
    deskBody.innerHTML = '<div class="placeholder">Not covered in this round of mockups. ' +
      "This is one of the screens the design system intentionally leaves out for now " +
      '(see its "what\'s intentionally not built" notes).</div>';
    applyChrome({ title: state.page, subtitle: "", crumb: null, actions: [] });
  }

  /**
   * Executes a trade from the "To confirm" column and clears it out.
   *
   * A live trade is confirmed on the link, so the Customer Portal picks up
   * status "Confirmed". The desk's own seeded example rows have no record
   * behind them, so they're simply dismissed from this page's state.
   */
  function confirmTrade(id) {
    var card = findCard(id);
    if (!card) { return; }
    if (card.request) {
      var next = Link.confirmTrade(card.request, {
        by: D.USER_LINE,
        reference: "ICE-" + String(id).replace(/\D/g, "") + "-A"
      });
      if (next) {
        try { Link.publish(window.localStorage, next); } catch (e) {
          console.warn("Confirmation not published to the Customer Portal:", e);
        }
        state.requests = Link.read(window.localStorage);
      }
    } else {
      state.confirmedSeedIds[id] = true;
    }
    if (state.view === "detail") { state.view = "list"; state.tradeId = null; }
    render();
  }

  /**
   * One entry per nav screen. `gap20` marks the two screens the mockup spaces
   * at 20px rather than 16px (Home, and the Trade desk's detail view); anything
   * not listed here falls through to the mockup's placeholder, which is exactly
   * Reference data and Audit.
   */
  var SCREENS = {
    "Home": { body: renderHome, chrome: homeChrome, gap20: true },
    "Trade desk": { self: renderDesk },
    "Customers": { body: renderCustomers, chrome: customersChrome },
    "Wallets": { body: renderWallets, chrome: walletsChrome },
    "Invoicing": { body: renderInvoicing, chrome: invoicingChrome },
    "Data & feeds": { body: renderDataFeeds, chrome: dataFeedsChrome }
  };

  /**
   * The Trade desk renders itself (it owns two views and writes its own chrome);
   * every cloned screen is a pure `body()` string plus a `chrome()` object.
   */
  function renderDesk() {
    // The mockup spaces the detail view 20px and the queue list 16px.
    deskBody.classList.toggle("gap-20", state.view === "detail");
    return state.view === "detail" ? renderDetail() : renderList();
  }

  function render() {
    var screen = SCREENS[state.page];
    if (!screen) { deskBody.classList.remove("gap-20"); return renderPlaceholder(); }
    if (screen.self) { return screen.self(); }
    deskBody.classList.toggle("gap-20", !!screen.gap20);
    deskBody.innerHTML = screen.body();
    applyChrome(screen.chrome());
  }

  // --- transitions ----------------------------------------------------------

  function openTrade(id) { state.tradeId = id; state.view = "detail"; render(); }
  function backToList() { state.tradeId = null; state.view = "list"; render(); }
  function clearRequests() {
    Link.clear(window.localStorage);
    state.requests = [];
    backToList();
  }

  /** Re-read the link and pulse anything we had not seen before. */
  function refresh(list) {
    var known = {};
    state.requests.forEach(function (r) { known[r.id] = true; });
    var next = list || Link.read(window.localStorage);
    next.forEach(function (r) { if (!known[r.id]) { state.flashIds[r.id] = true; } });
    state.requests = next;
    render();
  }

  window.BO = {
    goTo: goTo, openTrade: openTrade, backToList: backToList, clearRequests: clearRequests,
    refresh: refresh, sendOffer: sendOffer, onPriceInput: onPriceInput,
    confirmTrade: confirmTrade, parsePrice: parsePrice, noop: noop,
    selectCustomer: selectCustomer, closeCustomerDetail: closeCustomerDetail,
    startCommercialEdit: startCommercialEdit, cancelCommercialEdit: cancelCommercialEdit,
    saveCommercialEdit: saveCommercialEdit, updateCommercialField: updateCommercialField,
    _state: state
  };

  /**
   * Ticks every live countdown once a second. Queue tags are re-rendered in
   * place rather than re-rendering the list, so the desk doesn't flicker or
   * lose a partly-typed price.
   */
  setInterval(function () {
    if (!state.requests.some(Link.isPriced)) { return; }
    if (state.view === "list") {
      var cards = D.buildQueues(liveCards(), seedRows());
      cards.forEach(function (q) {
        q.trades.forEach(function (t) {
          if (!t.live || !t.request || !Link.isPriced(t.request)) { return; }
          var el = document.querySelector('[data-trade="' + t.id + '"] .dc-tag');
          if (!el) { return; }
          var tone = D.TAG_STYLE[t.tagTone] || D.TAG_STYLE.neutral;
          el.textContent = t.tag;
          el.style.background = tone.bg;
          el.style.borderColor = tone.border;
          el.style.color = tone.color;
        });
      });
      return;
    }
    var req = (findCard(state.tradeId) || {}).request;
    if (!req || !Link.isPriced(req)) { return; }
    var left = Link.secondsRemaining(req);
    var a = document.getElementById("detail-countdown");
    var b = document.getElementById("banner-countdown");
    if (a) { a.textContent = left > 0 ? Link.mmss(left) : "—"; }
    if (b) { b.textContent = Link.mmss(left); }
    // Re-render once at the moment of expiry so the banner/state flip over.
    if (left === 0 && !state.expiredShown[req.id]) { state.expiredShown[req.id] = true; render(); }
  }, 1000);

  // --- init -----------------------------------------------------------------

  renderSidebar();

  state.requests = Link.read(window.localStorage);
  render();

  // Live updates from a Customer Portal tab. storage events only fire in OTHER
  // tabs, which is exactly the cross-portal case we care about.
  Link.subscribe(window, function (list) { refresh(list); });

  // A same-tab fallback: if the desk is reopened or focused, re-read the link.
  window.addEventListener("focus", function () { refresh(); });
})();
</script>
</body>
</html>
