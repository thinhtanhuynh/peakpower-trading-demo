<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeakPower — Back Office Trade desk (Live Data)</title>
<style>
  :root {
    /* PeakPower colour tokens — Paleta SB-2026, adopted 2026-08-18.
       Read verbatim from the PeakPower Trading design system project
       (peakpower-trading-design-system); replaces the teal palette shipped
       2026-08-13. See CLAUDE.md "Design system sync (2026-08-18)" for the
       full mapping and what changed. A bright hex is a fill, a mark or a
       chart series; anything that becomes text or a numeral uses the
       matching *-text/*-value tier. */
    --pp-bg:#eef3f9; --pp-bg-2:#f7f9fc;
    --pp-bg-gradient:linear-gradient(180deg,#eef3f9 0%,#f7f9fc 60%);
    --pp-surface:#ffffff; --pp-surface-alt:#f2f5f9; --pp-surface-zebra:#fafcfe;
    --pp-border:#dde4ed; --pp-border-strong:#c3cddb;
    --pp-text-heading:#2D3F54; --pp-text-body:#52647A; --pp-text-faint:#8b98aa;
    --pp-sidebar-bg:#2D3F54; --pp-sidebar-text:#c2ccd9; --pp-sidebar-text-active:#ffffff;
    --pp-sidebar-subtitle:#43d3a6; --pp-sidebar-active-bg:rgba(255,255,255,0.10);
    --pp-rail-spectrum:linear-gradient(90deg,#004C94 0 20%,#006ECF 20% 40%,#1DBD8E 40% 60%,#EEB72B 60% 80%,#FF8F5C 80% 100%);
    --pp-blue-900:#003a72; --pp-blue-700:#004C94; --pp-blue-500:#006ECF; --pp-blue-300:#3C93FA;
    --pp-blue-100:#e7f0fa; --pp-blue-050:#eaf2fb;
    --pp-mint:#1DBD8E; --pp-mint-text:#016A6C; --pp-mint-bg:#e6f8f2; --pp-mint-border:#a6e3d1;
    --pp-teal:#0FA69D; --pp-teal-text:#0A7A74; --pp-teal-deep:#028183;
    --pp-cyan:#00D4C6;
    --pp-violet:#9151B8; --pp-violet-text:#6F3A91; --pp-violet-bg:#f3eaf9; --pp-violet-border:#d6b7e8;
    --pp-coral:#FF8F5C; --pp-coral-text:#B4531F; --pp-coral-bg:#fff0e8; --pp-coral-border:#ffc6a8;
    --pp-pink:#FF57B0; --pp-pink-text:#A62E76; --pp-pink-bg:#ffeaf5; --pp-pink-border:#ffb8dc;
    --pp-grass:#73CC80; --pp-grass-text:#1B7A4F;
    --pp-amber:#EEB72B; --pp-amber-bg:#fdf5e0; --pp-amber-border:#eed591; --pp-amber-text:#8A6710;
    --pp-green:#1DBD8E; --pp-green-bg:#e6f8f2; --pp-green-border:#a6e3d1; --pp-green-text:#016A6C;
    --pp-red:#F24F4F; --pp-red-bg:#fdecec; --pp-red-border:#f7b8b8; --pp-red-text:#C22A2A;
    --pp-red-value:#C22A2A;
    /* Named chart-series roles, straight from the design system — the JS
       chart builders below keep their own literal-hex constants (SVG string
       templates can't read a CSS var), kept byte-identical to these. */
    --pp-chart-usage:#006ECF; --pp-chart-hedge:#004C94;
    --pp-chart-short:#FF8F5C; --pp-chart-short-stroke:#F24F4F;
    --pp-chart-long:#0FA69D; --pp-chart-long-fill:#00D4C6;
    --pp-chart-peak:#3C93FA;
    /* legacy aliases — every var() written against these names keeps
       working; write new code against the ramps above. */
    --pp-teal-900:#2D3F54; --pp-teal-700:#004C94; --pp-teal-600:#004C94;
    --pp-teal-500:#1DBD8E; --pp-teal-300:#43d3a6; --pp-teal-100:#e6f8f2;
    --pp-indigo:#9151B8; --pp-indigo-bg:#f3eaf9;
    --pp-orange:#FF8F5C; --pp-orange-text:#B4531F;
    --certainty-provisional-opacity:0.55;
    --font-sans:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --font-mono:'SF Mono',Menlo,Consolas,monospace;
    --text-2xs:10px; --text-xs:11px; --text-sm:12.5px; --text-base:13.5px; --text-md:15px; --text-lg:17px; --text-xl:23px; --text-hero:32px; --text-display:44px;
    --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
    --tracking-eyebrow:0.05em;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
    --sidebar-width:236px; --topbar-height:64px;
    --pp-shadow-card:0 1px 2px rgba(45,63,84,.06), 0 10px 28px -18px rgba(45,63,84,.28);
    --pp-shadow-pop:0 12px 32px -12px rgba(45,63,84,.35);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--font-sans); background: var(--pp-bg-gradient); background-attachment: fixed; color: var(--pp-text-heading); }
  .app { display:flex; height:100vh; width:100%; overflow:hidden; }
  .sidebar { width:var(--sidebar-width); min-width:var(--sidebar-width); background:var(--pp-sidebar-bg); color:var(--pp-sidebar-text); display:flex; flex-direction:column; padding:20px 0; }
  .sidebar .brand { padding:0 20px 20px; font-size:11px; letter-spacing:var(--tracking-eyebrow); color:var(--pp-sidebar-subtitle); font-weight:700; text-transform:uppercase; }
  .sidebar nav { display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .sidebar nav a { display:block; padding:9px 12px; border-radius:7px; font-size:13px; color:var(--pp-sidebar-text); text-decoration:none; cursor:pointer; transition:background-color .15s ease, color .15s ease; }
  .sidebar nav a:hover:not(.active) { background:rgba(255,255,255,0.07); color:var(--pp-sidebar-text-active); }
  .sidebar nav a.active { background:var(--pp-sidebar-active-bg); color:var(--pp-sidebar-text-active); font-weight:600; }
  .sidebar-footer { margin-top:auto; padding:14px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:var(--pp-sidebar-text); }
  .sidebar-footer span { display:block; margin-top:2px; font-size:10.5px; color:#93a2b5; }
  .main { flex:1; display:flex; flex-direction:column; overflow:auto; }
  .topbar { height:var(--topbar-height); min-height:var(--topbar-height); background:#fff; border-bottom:1px solid var(--pp-border); display:flex; align-items:center; justify-content:space-between; padding:0 28px; position:sticky; top:0; z-index:5; gap:16px; }
  .topbar .crumb { font-size:11px; color:var(--pp-text-body); }
  .topbar .crumb .crumb-back { color:var(--pp-text-heading); font-weight:600; cursor:pointer; }
  .topbar .crumb .crumb-back:hover { color:var(--pp-teal-700); }
  .topbar .title { font-size:var(--text-lg); font-weight:700; color:var(--pp-text-heading); margin-top:2px; }
  .topbar .subtitle { font-size:11px; color:var(--pp-text-body); }
  .topbar-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  /* Holds the demo clock beside the screen's own actions. #topbar-actions has
     its innerHTML replaced on every render, so the clock cannot live inside it. */
  .topbar-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  /* Demo clock — shifts what the desk thinks "now" is by whole days, so a
     balance's run-up to its due date can be shown on demand instead of waited
     for. Amber once shifted: a faked present must never read as the real one. */
  .demo-clock { display:flex; align-items:center; gap:8px; padding:5px 8px 5px 10px; border:1px solid var(--pp-border); border-radius:var(--radius-md); background:var(--pp-surface-alt); }
  .demo-clock .demo-clock-dot { width:8px; height:8px; border-radius:2px; background:var(--pp-border-strong); flex-shrink:0; }
  .demo-clock .demo-clock-text { font-size:11px; font-weight:600; color:var(--pp-text-body); white-space:nowrap; }
  .demo-clock input[type="date"] { font-family:inherit; font-size:11px; color:var(--pp-text-heading); border:1px solid var(--pp-border); border-radius:var(--radius-sm); padding:3px 6px; background:#fff; }
  .demo-clock .demo-clock-reset-btn { font-family:inherit; font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--radius-sm); border:1px solid var(--pp-border); background:#fff; color:var(--pp-text-body); cursor:pointer; }
  .demo-clock .demo-clock-reset-btn:hover:not(:disabled) { border-color:var(--pp-border-strong); color:var(--pp-text-heading); }
  .demo-clock .demo-clock-reset-btn:disabled { opacity:.45; cursor:default; }
  .demo-clock.shifted { background:var(--pp-amber-bg); border-color:var(--pp-amber-border); }
  .demo-clock.shifted .demo-clock-dot { background:var(--pp-amber); }
  .demo-clock.shifted .demo-clock-text { color:var(--pp-amber-text); }
  /* Badge — matches PeakPowerDesignSystem Badge.jsx exactly (11px/600,
     4px 12px, and every tone carries a real 1px border). */
  .badge { display:inline-block; padding:4px 12px; border-radius:var(--radius-pill); font-size:11px; font-weight:600; line-height:1.2; border:1px solid transparent; white-space:nowrap; }
  .badge.info { background:var(--pp-indigo-bg); color:var(--pp-violet-text); border-color:var(--pp-violet-border); }
  .badge.success { background:var(--pp-green-bg); color:var(--pp-green-text); border-color:var(--pp-green-border); }
  .badge.warning { background:var(--pp-amber-bg); color:var(--pp-amber-text); border-color:var(--pp-amber-border); }
  .badge.critical { background:var(--pp-red-bg); color:var(--pp-red-text); border-color:var(--pp-red-border); }
  .badge.brand { background:var(--pp-teal-100); color:var(--pp-teal-700); border-color:var(--pp-teal-300); }
  .badge.neutral { background:var(--pp-surface-alt); color:var(--pp-text-body); border-color:var(--pp-border-strong); }
  /* Screens this page doesn't implement use the Back Office mockup's own
     placeholder treatment, verbatim (it has an `isPlaceholder` screen for
     exactly this). The nav itself stays fully navigable, as in the mockup. */
  .placeholder { background:#fff; border:1px solid var(--pp-border); border-radius:10px; padding:48px 24px; text-align:center; color:var(--pp-text-body); font-size:13px; }
  .content { padding:28px; }
  .page { display:none; flex-direction:column; gap:16px; }
  .page.active { display:flex; animation:pp-fade-in .18s ease; }
  @keyframes pp-fade-in { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:translateY(0); } }
  /* Every screen renders into one #desk-body wrapper, so the wrapper carries
     the section gap — .page has a single child (see CLAUDE.md). Each of the
     mockup's screens wraps itself in `padding:28px; flex-direction:column;
     gap:N`; .content supplies the padding, and this supplies the gap. The
     mockup uses 20px on Home and the trade detail, 16px everywhere else. */
  #desk-body { display:flex; flex-direction:column; gap:16px; }
  #desk-body.gap-20 { gap:20px; }
  /* Card — matches PeakPowerDesignSystem Card.jsx. Note the head's own
     margin-bottom is 14px, dropping to 4px when a subtitle follows it (the
     subtitle is a SIBLING of the head in the DS, not a child, and carries the
     remaining 14px itself). */
  .card { background:#fff; border:1px solid var(--pp-border); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--pp-shadow-card); }
  .card .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .card .card-head.has-subtitle { margin-bottom:4px; }
  .card .card-title { font-size:13.5px; font-weight:700; color:var(--pp-text-heading); }
  .card .card-subtitle { font-size:11.5px; color:var(--pp-text-body); margin-bottom:14px; }
  /* StatCard — matches StatCard.jsx, including its amber `highlight` variant. */
  .stat-row { display:flex; gap:16px; flex-wrap:wrap; }
  /* No flex-grow: StatCard.jsx sets only min-width, so the mockup's stat rows
     size to content and pack left rather than stretching edge to edge. */
  .stat-card { position:relative; overflow:hidden; background:#fff; border:1px solid var(--pp-border); border-radius:var(--radius-lg); padding:14px 16px; min-width:160px; box-shadow:var(--pp-shadow-card); }
  /* SB-2026's 3px accent cap — see customer-portal.html's identical rule for
     the full rationale. Untoned cards get a neutral cap rather than none. */
  .stat-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--pp-border-strong); }
  .stat-card.brand::before { background:var(--pp-blue-700); }
  .stat-card.critical::before { background:var(--pp-red); }
  .stat-card.warning::before { background:var(--pp-amber); }
  .stat-card.success::before { background:var(--pp-green); }
  .stat-card.highlight { background:var(--pp-amber-bg); border-color:var(--pp-amber-border); }
  .stat-card .label { font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--pp-text-body); text-transform:uppercase; }
  .stat-card .value { font-size:23px; font-weight:700; margin-top:8px; color:var(--pp-text-heading); }
  .stat-card .value.critical { color:var(--pp-red-text); }
  .stat-card .value.warning { color:var(--pp-amber-text); }
  .stat-card .value.success { color:var(--pp-green-text); }
  .stat-card .value.brand { color:var(--pp-teal-600); }
  .stat-card .sublabel { font-size:11px; color:var(--pp-text-faint); margin-top:6px; }
  
.btn-primary, .btn-secondary, .btn-danger { display:inline-flex; align-items:center; gap:8px; border-radius:var(--radius-md); padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-sans); border:1px solid; transition:background .15s ease, border-color .15s ease; }
  .btn-primary { background:var(--pp-teal-600); border-color:var(--pp-teal-600); color:#fff; }
  .btn-primary:hover:not(:disabled) { background:var(--pp-teal-700); border-color:var(--pp-teal-700); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary { background:#fff; border-color:var(--pp-border-strong); color:var(--pp-text-heading); }
  .btn-secondary:hover:not(:disabled) { background:var(--pp-surface-alt); }
  .btn-secondary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sm { padding:7px 14px; font-size:12px; }
  /* No danger variant existed before "Mark failed"/"Withdraw offer" needed
     one. It is built off the existing --pp-red-* tokens rather than a new hex,
     and it must stay in the shared shape selector above — carrying only its
     three colour declarations, as it did originally, leaves it with the
     browser's default button box (square corners, no border drawn since
     border-color without border-style paints nothing, wrong font) sitting
     beside a Confirm button that is a rounded pill. A tone variant sets
     colour; the shape always comes from the shared rule. */
  .btn-danger { background:var(--pp-red-value); border-color:var(--pp-red-value); color:#fff; }
  .btn-danger:hover:not(:disabled) { background:#9b2222; border-color:#9b2222; }
  .btn-danger:disabled { opacity:.5; cursor:not-allowed; }
  /* Timeline — matches PeakPowerDesignSystem Timeline.jsx (6px dot, 13px 0
     row padding, top rule between entries, title 12.5/600, subtitle 10.5/
     faint mt2). tradeDetail()'s entries never carry a timestamp, so that
     slot (10px/faint, DS-supported but unused here) is simply omitted. */
  .timeline-item { display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--pp-border); }
  .timeline-item:first-child { border-top:none; }
  .timeline-dot { width:6px; height:6px; border-radius:50%; margin-top:6px; flex-shrink:0; }
  .timeline-title { font-size:12.5px; font-weight:600; color:var(--pp-text-heading); }
  .timeline-subtitle { font-size:10.5px; color:var(--pp-text-body); margin-top:2px; }
  
.banner { display:flex; align-items:center; gap:12px; border-radius:var(--radius-lg); padding:12px 16px; font-size:12.5px; }
  .banner-amber { background:var(--pp-amber-bg); border:1px solid var(--pp-amber-border); color:var(--pp-amber-text); }
  .banner-teal { background:var(--pp-teal-100); border:1px solid var(--pp-teal-300); color:var(--pp-teal-900); }
  .banner-icon { width:22px; height:22px; border-radius:50%; background:var(--pp-amber); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .banner-body { flex:1; }
  /* The DS Banner proper (Banner.jsx): 14px/18px padding, 14px gap, a coloured
     22px dot, a 13/700 title and an 11.5px body. `.banner` above is this page's
     own lighter one-line variant, kept as-is for the Trade desk. */
  .ds-banner { display:flex; align-items:center; gap:14px; border-radius:var(--radius-lg); padding:14px 18px; }
  .ds-banner .db-dot { width:22px; height:22px; min-width:22px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .ds-banner .db-title { font-size:13px; font-weight:700; }
  .ds-banner .db-body { font-size:11.5px; margin-top:3px; }
  .ds-banner.critical { background:var(--pp-red-bg); border:1px solid var(--pp-red-border); color:var(--pp-red-text); }
  .ds-banner.critical .db-dot { background:var(--pp-red); }
  .ds-banner.warning { background:var(--pp-amber-bg); border:1px solid var(--pp-amber-border); color:var(--pp-amber-text); }
  .ds-banner.warning .db-dot { background:var(--pp-amber); }
  .ds-banner.info { background:var(--pp-teal-100); border:1px solid var(--pp-teal-300); color:var(--pp-teal-700); }
  .ds-banner.info .db-dot { background:var(--pp-teal-600); }

  /* --- Trade desk ------------------------------------------------------- */
  .desk-columns { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; }
  .desk-column { flex:1; min-width:280px; }
  .desk-queue { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .desk-empty { font-size:12px; color:var(--pp-text-faint); padding:18px 0; }

  /* Card geometry ported from the Back Office mockup's queue cards. */
  .desk-card { cursor:pointer; background:#fff; border:1px solid var(--pp-border); border-radius:8px; padding:14px 16px; transition:border-color .15s ease, box-shadow .15s ease; }
  .desk-card:hover { border-color:var(--pp-border-strong); }
  .desk-card.urgent { background:var(--pp-red-bg); border-color:var(--pp-red-border); }
  /* A request that arrived from the Customer Portal in this session. */
  .desk-card.live { background:var(--pp-teal-100); border-color:var(--pp-teal-300); }
  .desk-card.flash { animation:desk-flash 1.4s ease; }
  @keyframes desk-flash { 0% { box-shadow:0 0 0 0 rgba(20,184,166,.55); } 100% { box-shadow:0 0 0 14px rgba(20,184,166,0); } }

  .desk-card .dc-top { display:flex; justify-content:space-between; align-items:center; }
  .desk-card .dc-id { font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--pp-teal-600); }
  .desk-card .dc-tag { font-family:var(--font-mono); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:5px; border:1px solid; }
  .desk-card .dc-customer { font-size:12.5px; font-weight:600; color:var(--pp-text-heading); margin-top:8px; }
  .desk-card .dc-line { display:flex; justify-content:space-between; align-items:baseline; margin-top:2px; }
  .desk-card .dc-meta { font-size:11px; color:var(--pp-text-body); }
  .desk-card .dc-value { font-size:12px; font-weight:700; color:var(--pp-text-heading); }
  .desk-card .dc-action { font-size:10px; font-weight:600; color:var(--pp-teal-600); margin-top:10px; }
  .desk-card .dc-confirm { display:flex; gap:8px; margin-top:10px; }
  .desk-card .dc-confirm button { flex:1; justify-content:center; }

  .desk-note { background:var(--pp-surface-alt); border:1px solid var(--pp-border-strong); border-radius:8px; padding:12px 16px; font-size:12px; color:var(--pp-text-body); }

  /* --- Request detail ---------------------------------------------------- */
  .detail-grid { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .detail-main { flex:1.55; min-width:520px; display:flex; flex-direction:column; gap:20px; }
  .detail-side { flex:1; min-width:260px; display:flex; flex-direction:column; gap:20px; }
  .kv-row { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; }
  .kv-row .k { color:var(--pp-text-body); }
  .kv-row .v { font-weight:600; text-align:right; }
  .kv-row .v.mono { font-family:var(--font-mono); font-weight:500; font-size:11.5px; }
  .grid-table { border:1px solid var(--pp-border); border-radius:var(--radius-lg); overflow:hidden; background:#fff; }
  .gt-head { display:grid; background:var(--pp-surface-alt); font-size:10px; font-weight:700; color:var(--pp-text-body); letter-spacing:.03em; padding:9px 12px; gap:10px; border-bottom:1px solid var(--pp-border); }
  .gt-row { display:grid; padding:11px 12px; font-size:12px; color:var(--pp-text-heading); border-top:1px solid var(--pp-border); align-items:center; gap:10px; }
  .gt-head + .gt-row { border-top:none; }
  .gt-num { text-align:right; }
  .gt-sub { font-size:10px; color:var(--pp-text-faint); font-family:var(--font-mono); }
  /* --- Pricing form ------------------------------------------------------ */
  .price-form { display:flex; flex-direction:column; gap:14px; }
  .price-form .pf-row { display:flex; flex-direction:column; gap:6px; }
  .price-form .pf-label { font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--pp-text-body); text-transform:uppercase; }
  .price-form .pf-input { border:1.5px solid var(--pp-teal-600); border-radius:var(--radius-md); padding:9px 12px; font-size:13px; font-weight:600; font-family:var(--font-mono); color:var(--pp-teal-700); background:#fff; width:100%; }
  .price-form .pf-input:focus { outline:none; border-color:var(--pp-blue-300); box-shadow:0 0 0 3px rgba(60,147,250,.22); }
  .price-form .pf-total { font-size:12px; color:var(--pp-text-body); background:var(--pp-surface-alt); border:1px solid var(--pp-border); border-radius:var(--radius-md); padding:10px 12px; }
  .price-form .pf-total strong { color:var(--pp-text-heading); font-size:13.5px; }
  .price-form .pf-error { font-size:11.5px; color:var(--pp-red-text); min-height:14px; }
  .price-form .pf-actions { display:flex; gap:10px; }

  .crumb-back { cursor:pointer; color:var(--pp-teal-600); font-weight:600; }
  .crumb-back:hover { text-decoration:underline; }
  .empty-note { font-size:12.5px; color:var(--pp-text-body); }
  /* Public-demo disclaimer, pinned below the page content. */
  .demo-footer { margin-top:24px; padding-top:14px; border-top:1px solid var(--pp-border);
                 font-size:11.5px; line-height:1.55; color:var(--pp-text-faint); }
  .demo-footer b { color:var(--pp-text-body); font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Back office</div>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-footer">M. Bakker<span>Trading</span></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <div class="title" id="page-title">Trade desk</div>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
      <div class="topbar-right">
        <div class="demo-clock" id="demo-clock">
          <span class="demo-clock-dot"></span>
          <span class="demo-clock-text" id="demo-clock-label">Demo clock — today</span>
          <input type="date" id="demo-clock-date" aria-label="Demo clock date">
          <button type="button" class="demo-clock-reset-btn" id="demo-clock-reset" disabled>Reset</button>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
    </div>
    <div class="content">
      <div class="page active" id="page-desk">
        <div id="desk-body"></div>
      </div>

      <div class="demo-footer">
        <b>Demo only.</b> All data on this site — customers, connections, trades,
        prices, wallets — is synthetic test data generated for this proof of concept.
        It does not represent real customers, accounts, or transactions.
      </div>
    </div>
  </div>
</div>

<script src="portal-trade-link.js"></script>
<script src="portal-terms-link.js"></script>
<script src="portal-seed-data.js"></script>
<script src="back-office-desk-data.js"></script>
<script src="back-office-screens-data.js"></script>
<script src="portal-demo-clock.js"></script>
<script>
(function () {
  "use strict";

  var D = BackOfficeDeskData;
  var Link = PortalTradeLink;
  // The forward curve (WIZARD_PERIODS) — same rows that already
  // drive the Customer Portal's Prices screen and trading wizard, reused
  // here rather than a private copy, so a desk market-reference figure can
  // never drift from what the customer is quoted elsewhere in the product.
  var Seed = PortalSeedData;

  var S = BackOfficeScreensData;

  var state = {
    page: "Trade desk",    // which nav entry is showing
    view: "list",          // "list" | "detail" (Trade desk only)
    tradeId: null,
    confirmedSeedIds: {},  // seeded To-confirm rows cleared on this page
    requests: [],          // live requests published by the Customer Portal
    flashIds: {},          // ids to pulse once, so a new arrival is noticeable
    expiredShown: {},      // ids already re-rendered at the moment of expiry
    customerId: null,      // open customer on the Customers screen
    commercialEditing: false,
    // Per customer, keyed by kvk. It used to be one shared list, which was
    // harmless while every field was decorative — but the deposit % is a real
    // per-customer term the Customer Portal obeys, and one shared list would
    // have meant editing Vandersteen's deposit silently changed Kramer's.
    commercialByCustomer: {},
    commercialSnapshot: null,  // pre-edit copy, so Cancel can actually cancel
    // Whole days the demo clock is shifted by; 0 is the real clock. Shared
    // with the Customer Portal over the link, so both agree on what day it is.
    demoOffsetDays: 0
  };

  /**
   * This customer's commercial fields, seeded from the mockup's defaults on
   * first open and with the deposit % read from the cross-portal terms link
   * (see portal-terms-link.js) so a reload does not lose what the desk set.
   */
  function commercialFieldsFor(kvk) {
    if (!state.commercialByCustomer[kvk]) {
      var pct = PortalTermsLink.depositPctFor(PortalTermsLink.read(window.localStorage), kvk);
      state.commercialByCustomer[kvk] = S.COMMERCIAL_FIELDS.map(function (fld) {
        if (fld.key !== "depositPct") { return fld; }
        var numeric = String(pct).replace(".", ",");
        var next = {};
        for (var k in fld) { if (fld.hasOwnProperty(k)) { next[k] = fld[k]; } }
        next.numeric = numeric;
        next.value = numeric + fld.suffix;
        return next;
      });
    }
    return state.commercialByCustomer[kvk];
  }

  var deskBody = document.getElementById("desk-body");
  var crumb = document.getElementById("crumb");
  var pageTitle = document.getElementById("page-title");
  var pageSubtitle = document.getElementById("page-subtitle");
  var topbarActions = document.getElementById("topbar-actions");

  // --- helpers --------------------------------------------------------------

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function badge(text, tone) { return '<span class="badge ' + tone + '">' + esc(text) + "</span>"; }
  /** The DS Card: head (title + action), then the subtitle as its sibling. */
  function cardHtml(title, subtitle, body, action) {
    return '<div class="card">' +
      '<div class="card-head' + (subtitle ? " has-subtitle" : "") + '">' +
        '<div><div class="card-title">' + esc(title) + "</div></div>" + (action || "") +
      "</div>" +
      (subtitle ? '<div class="card-subtitle">' + esc(subtitle) + "</div>" : "") +
      body + "</div>";
  }

  /** The DS StatCard. `tone` colours the value; `highlight` tints the card. */
  function statCard(label, value, tone, sublabel, highlight) {
    // The tone rides on the outer card too — see .stat-card::before — so a
    // card's top edge names its domain colour, not just the numeral itself.
    var toneClass = (tone && tone !== "default") ? " " + tone : "";
    return '<div class="stat-card' + toneClass + (highlight ? " highlight" : "") + '">' +
      '<div class="label">' + esc(label) + "</div>" +
      '<div class="value' + toneClass + '">' + esc(value) + "</div>" +
      (sublabel ? '<div class="sublabel">' + esc(sublabel) + "</div>" : "") +
      "</div>";
  }

  /**
   * A DS Card `action` slot that is just a label ("41 · showing 5", "last 24 h").
   * The mockup passes a bare string, which Card.jsx drops into the head with no
   * styling — so it inherits 16px next to a 13.5px title, plainly unintended.
   * It gets the card subtitle's type here instead, consistently across screens.
   */
  function cardAction(text) {
    return '<span style="font-size:11.5px;color:var(--pp-text-body)">' + esc(text) + "</span>";
  }

  /** The DS Banner (Banner.jsx), distinct from this page's lighter `.banner`. */
  function dsBanner(tone, title, body, actionHtml) {
    return '<div class="ds-banner ' + tone + '">' +
      (title ? '<div class="db-dot">!</div>' : "") +
      '<div style="flex:1">' +
        (title ? '<div class="db-title">' + esc(title) + "</div>" : "") +
        (body ? '<div class="db-body">' + esc(body) + "</div>" : "") +
      "</div>" + (actionHtml || "") + "</div>";
  }

  function noop() {}

  /**
   * The topbar, driven by one chrome object per screen — the shape the mockup's
   * own renderVals() computes (topTitle / topSubtitle / hasCrumb+backLabel+
   * crumbRest / topActions). Crumb and subtitle are mutually exclusive in the
   * mockup: a list screen has a subtitle, a detail screen has a crumb.
   *
   *   { title, subtitle, crumb: {backLabel, backFn, rest} | null,
   *     actions: [{ label, variant, onClick }] }
   */
  function applyChrome(c) {
    pageTitle.textContent = c.title || "";
    pageSubtitle.textContent = c.subtitle || "";
    crumb.innerHTML = c.crumb
      ? '<span class="crumb-back" onclick="' + c.crumb.backFn + '">' + esc(c.crumb.backLabel) + "</span> › " + esc(c.crumb.rest)
      : "";
    topbarActions.innerHTML = (c.actions || []).map(function (a) {
      return '<button type="button" class="btn-' + (a.variant === "primary" ? "primary" : "secondary") +
        '" onclick="' + (a.onClick || "BO.noop()") + '">' + esc(a.label) + "</button>";
    }).join("");
  }

  /**
   * All live requests as desk cards, newest-first handled by buildQueues.
   * Note the explicit wrapper: passing `Link.toDeskCard` straight to map()
   * would hand it the array index as its `now` argument, pinning every
   * countdown to the epoch.
   */
  function liveCards() {
    return state.requests.map(function (r) { return Link.toDeskCard(r, nowForLink()); });
  }

  /** The seeded rows still on the desk (confirmed ones are cleared out). */
  function seedRows() {
    return D.TRADES.filter(function (t) { return !state.confirmedSeedIds[t.id]; });
  }

  function findCard(id) {
    var all = D.buildQueues(liveCards(), seedRows());
    for (var q = 0; q < all.length; q++) {
      for (var i = 0; i < all[q].trades.length; i++) {
        if (all[q].trades[i].id === id) { return all[q].trades[i]; }
      }
    }
    return null;
  }

  // --- list view ------------------------------------------------------------

  function deskCardHtml(t) {
    var tone = D.TAG_STYLE[t.tagTone] || D.TAG_STYLE.neutral;
    var cls = "desk-card" + (t.live ? " live" : (t.urgent ? " urgent" : "")) +
      (state.flashIds[t.id] ? " flash" : "");
    // data-trade is what the once-a-second ticker finds to update this card's
    // countdown tag in place; without it the tag freezes until a full re-render.
    return '<div class="' + cls + '" data-trade="' + esc(t.id) + '" onclick="BO.openTrade(\'' + esc(t.id) + '\')">' +
      '<div class="dc-top">' +
        '<span class="dc-id">' + esc(t.id) + "</span>" +
        '<span class="dc-tag" style="background:' + tone.bg + ';border-color:' + tone.border + ';color:' + tone.color + '">' + esc(t.tag) + "</span>" +
      "</div>" +
      '<div class="dc-customer">' + esc(t.customer) + "</div>" +
      '<div class="dc-line"><span class="dc-meta">' + esc(t.meta) + '</span>' +
        '<span class="dc-value">' + esc(t.valueLabel) + "</span></div>" +
      // Everything in "To confirm" gets Confirm AND Mark failed — the mockup's
      // own two actions for this column (tradeDetail's confirm branch) — so
      // the card's "confirm or fail →" label actually matches what's here.
      // stopPropagation on both keeps the click off the card's own
      // open-detail handler.
      (t.column === "confirm"
        ? '<div class="dc-confirm">' +
            '<button type="button" class="btn-primary btn-sm" ' +
            'onclick="event.stopPropagation(); BO.confirmTrade(\'' + esc(t.id) + '\')">Confirm</button>' +
            '<button type="button" class="btn-danger btn-sm" ' +
            'onclick="event.stopPropagation(); BO.failTrade(\'' + esc(t.id) + '\')">Mark failed</button>' +
          "</div>"
        : '<div class="dc-action">' + esc(t.actionLabel) + "</div>") +
      "</div>";
  }

  function renderList() {
    var queues = D.buildQueues(liveCards(), seedRows());
    var cols = queues.map(function (q) {
      var body = q.trades.length
        ? '<div class="desk-queue">' + q.trades.map(deskCardHtml).join("") + "</div>"
        : '<div class="desk-empty">Nothing in this queue.</div>';
      return '<div class="desk-column">' +
        cardHtml(q.title, q.subtitle, body, badge(q.countLabel, q.badgeTone)) +
        "</div>";
    }).join("");

    deskBody.innerHTML =
      '<div class="desk-columns">' + cols + "</div>" +
      '<div class="desk-note">Offers under 5 minutes are highlighted. Expiry is decided server-side — ' +
      "an expired offer cannot be accepted even if a customer's screen still shows a timer.</div>";

    var open = queues.reduce(function (n, q) { return n + q.trades.length; }, 0);
    applyChrome({
      title: "Trade desk",
      subtitle: open + " open item" + (open === 1 ? "" : "s") + " · live queue",
      crumb: null,
      actions: state.requests.length
        ? [{ label: "Clear live requests", variant: "secondary", onClick: "BO.clearRequests()" }]
        : []
    });

    // Each arrival pulses once.
    state.flashIds = {};
  }

  // --- detail view ----------------------------------------------------------

  function renderDetail() {
    var t = findCard(state.tradeId);
    if (!t) { state.view = "list"; return renderList(); }

    applyChrome({
      title: t.customer, subtitle: "",
      crumb: { backLabel: "Trade desk", backFn: "BO.backToList()", rest: t.id },
      actions: []
    });

    var req = t.request;
    if (!req) {
      // Seeded mockup rows carry no underlying request payload — but the
      // mockup itself has real detail for every one of these (tradeDetail(),
      // plus TRD-1058's own richer panel), which an apology was standing in
      // for. TRD-1058 is the one row the mockup gives the full rich detail
      // (connection table, market/wallet reference, chart, offer form) —
      // everything else gets the compact timeline+summary view.
      deskBody.innerHTML = t.id === "TRD-1058" ? renderRichSeedDetail(t) : renderCompactSeedDetail(t);
      return;
    }

    var priced = Link.isPriced(req);
    var resolved = Link.isResolved(req);
    var confirmed = Link.isConfirmed(req);
    var failed = Link.isFailed(req);
    var accepted = resolved && req.response.action === "accept";
    var left = Link.secondsRemaining(req, nowForLink());
    var facts = [
      ["Reference", req.id], ["Customer", req.customer], ["State", Link.effectiveStatus(req, nowForLink())],
      ["Direction", req.direction], ["Shape", req.shape], ["Delivery period", req.period],
      ["Period start", req.periodStart], ["Period end", req.periodEnd],
      ["Total power", Link.formatMw(req.powerMw)], ["Total volume", Link.formatMwh(req.volumeMwh)],
      ["Indicative price", req.indicativePrice != null ? "€ " + Link.formatNL(req.indicativePrice, 2) + " / MWh" : "—"],
      ["Submitted", req.submittedAt ? new Date(req.submittedAt).toLocaleString("nl-NL") : "—"]
    ];
    if (priced) {
      facts.push(["Offered price", "€ " + Link.formatNL(req.offer.priceMwh, 4) + " / MWh"]);
      facts.push(["Total value", "€ " + Link.formatNL(req.offer.valueEur, 2)]);
      facts.push(["Priced by", req.offer.pricedBy]);
      facts.push(["Expires", new Date(req.offer.expiresAt).toLocaleTimeString("nl-NL")]);
    }
    var factsHtml = facts.map(function (f) {
      return '<div class="kv-row"><span class="k">' + esc(f[0]) + '</span><span class="v">' + esc(f[1]) + "</span></div>";
    }).join("");

    // The connections this block is traded for, and nothing else: the desk
    // prices the whole request, so the per-connection split is not a pricing
    // input. The one figure that is — the total — sits in the footer, in
    // TRD-1058's own format (2px rule, label + badge left, 14px/700 right).
    var cols = "2fr 1fr";
    var rows = req.connections.map(function (c) {
      return '<div class="gt-row" style="grid-template-columns:' + cols + '">' +
        "<div>" + esc(c.name) + "</div>" +
        '<div style="font-family:var(--font-mono)">' + esc(c.sub) + "</div>" +
        "</div>";
    }).join("");
    var totalLabel = Link.formatMw(req.powerMw) + " · " + Link.formatMwh(req.volumeMwh);
    var connTable = '<div class="grid-table">' +
      '<div class="gt-head" style="grid-template-columns:' + cols + '">' +
        "<div>CONNECTION</div><div>EAN</div>" +
      "</div>" + rows +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:2px solid var(--pp-border-strong)">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:12.5px;font-weight:700;color:var(--pp-text-heading)">Total requested</span>' +
          badge(String(req.direction).toUpperCase() + " · " + String(req.shape).toUpperCase(),
            String(req.direction).toLowerCase() === "sell" ? "warning" : "brand") +
        "</div>" +
        '<span style="font-size:14px;font-weight:700;color:var(--pp-text-heading)">' + esc(totalLabel) + "</span>" +
      "</div></div>";

    // The pricing form (unpriced) or the sent-offer summary (priced).
    var pricePanel;
    if (!priced) {
      var indicative = req.indicativePrice != null ? Link.formatNL(req.indicativePrice, 2) : "";
      pricePanel = cardHtml("Send a price", "The customer sees a firm offer with a countdown",
        '<div class="price-form">' +
          '<div class="pf-row">' +
            '<label class="pf-label" for="price-input">Offer price (€ / MWh)</label>' +
            '<input type="text" id="price-input" class="pf-input" value="' + esc(indicative) + '" inputmode="decimal" oninput="BO.onPriceInput()">' +
          "</div>" +
          '<div class="pf-row">' +
            '<label class="pf-label" for="window-input">Reaction window (minutes)</label>' +
            '<input type="number" id="window-input" class="pf-input" value="30" min="1" max="240" oninput="BO.onPriceInput()">' +
          "</div>" +
          '<div class="pf-total" id="price-total"></div>' +
          '<div class="pf-error" id="price-error"></div>' +
          '<div class="pf-actions"><button type="button" class="btn-primary" id="send-offer" onclick="BO.sendOffer()">Send offer</button></div>' +
        "</div>");
    } else {
      var offerRows =
        '<div class="kv-row"><span class="k">Price</span><span class="v">€ ' + Link.formatNL(req.offer.priceMwh, 4) + " / MWh</span></div>" +
        '<div class="kv-row"><span class="k">Total value</span><span class="v">€ ' + Link.formatNL(req.offer.valueEur, 2) + "</span></div>" +
        '<div class="kv-row"><span class="k">Reaction window</span><span class="v">' + req.offer.reactionMinutes + " min</span></div>";
      offerRows += resolved
        ? '<div class="kv-row"><span class="k">' + (accepted ? "Accepted by" : "Rejected by") + '</span>' +
            '<span class="v">' + esc(req.response.by) + "</span></div>" +
          '<div class="kv-row"><span class="k">Responded</span><span class="v mono">' +
            esc(Link.formatStamp(req.response.at)) + "</span></div>"
        : '<div class="kv-row"><span class="k">' + (left > 0 ? "Expires in" : "Expired") + '</span>' +
            '<span class="v mono" id="detail-countdown">' + (left > 0 ? Link.mmss(left) : "—") + "</span></div>";
      pricePanel = cardHtml(confirmed ? "Trade confirmed" : (failed ? "Execution failed" : (resolved ? (accepted ? "Offer accepted" : "Offer rejected") : "Offer sent")),
        req.offer.pricedBy + " · " + Link.formatStamp(req.offer.pricedAt), offerRows);
    }

    var banner;
    if (confirmed) {
      banner = '<div class="banner banner-teal">Executed and confirmed' +
        (req.confirmation.reference ? " — reference <strong>" + esc(req.confirmation.reference) + "</strong>" : "") + ".</div>";
    } else if (failed) {
      banner = '<div class="banner banner-amber"><div class="banner-icon">!</div><div class="banner-body">Marked as execution failed' +
        (req.failure && req.failure.reason ? " — " + esc(req.failure.reason) : "") +
        ". The customer's reservation has been released.</div></div>";
    } else if (!priced) {
      banner = '<div class="banner banner-teal">Live request received from the Customer Portal — awaiting a price from the desk.</div>';
    } else if (resolved && accepted) {
      // Confirm AND Mark failed, side by side — the same pair the "To confirm"
      // queue card offers, so a desk user isn't stuck choosing between the
      // list and the detail view for which action is available where.
      banner = '<div class="banner banner-teal">Accepted by the customer — confirm to execute and clear it from <strong>To confirm</strong>.' +
        '<span style="margin-left:auto;display:flex;gap:8px">' +
        '<button type="button" class="btn-primary btn-sm" onclick="BO.confirmTrade(\'' + esc(req.id) + '\')">Confirm</button>' +
        '<button type="button" class="btn-danger btn-sm" onclick="BO.failTrade(\'' + esc(req.id) + '\')">Mark failed</button>' +
        "</span></div>";
    } else if (resolved) {
      banner = '<div class="banner banner-amber"><div class="banner-icon">!</div><div class="banner-body">The customer rejected this offer. No volume was contracted.</div></div>';
    } else if (left > 0) {
      banner = '<div class="banner banner-teal">Offer sent — the customer has <strong id="banner-countdown">' + Link.mmss(left) + "</strong> to respond.</div>";
    } else {
      banner = '<div class="banner banner-amber"><div class="banner-icon">!</div><div class="banner-body">The reaction window closed before the customer responded.</div></div>';
    }

    deskBody.innerHTML =
      banner +
      '<div class="detail-grid">' +
        '<div class="detail-main">' +
          cardHtml("The request", req.direction + " · " + req.shape + " · " + req.period, connTable) +
          (req.note ? cardHtml("Customer note", "", '<div class="empty-note">' + esc(req.note) + "</div>") : "") +
        "</div>" +
        // Wallet check only when this customer has a real row on the
        // Wallets screen — omitted, not guessed, for anyone else (a
        // freshly-submitted live request's customer may not be seeded
        // there at all, and this page has no live wallet API to fall
        // back on).
        '<div class="detail-side">' + pricePanel +
          liveMarketReferenceCardHtml(req) +
          walletCheckHtml(walletFor(req.customer), priced ? req.offer.valueEur : null) +
          cardHtml("Request details", "", factsHtml) +
        "</div>" +
      "</div>";

    if (!priced) { updatePriceTotal(); }
  }

  /**
   * The mockup's Timeline.jsx, ported verbatim (6px dot per tone, top rule
   * between entries, no timestamp column — tradeDetail()'s entries never
   * populate one). `entries` is D.tradeDetail(t).timeline.
   */
  function timelineHtml(entries) {
    var dot = {
      success: "var(--pp-green)", critical: "var(--pp-red)", warning: "var(--pp-amber)",
      info: "var(--pp-indigo)", neutral: "var(--pp-text-faint)"
    };
    return entries.map(function (e) {
      return '<div class="timeline-item">' +
        '<div class="timeline-dot" style="background:' + (dot[e.tone] || dot.neutral) + '"></div>' +
        '<div style="flex:1"><div class="timeline-title">' + esc(e.title) + "</div>" +
        (e.subtitle ? '<div class="timeline-subtitle">' + esc(e.subtitle) + "</div>" : "") +
        "</div></div>";
    }).join("");
  }

  /**
   * A seeded trade card's own customer record and wallet, looked up by name
   * from the SAME seed data the Customers/Wallets screens render — so
   * anything derived from them can never disagree with what those screens
   * show, because it's the identical row, not a second copy of the number.
   * Prefix match handles CUSTOMER_LIST's "… B.V." suffix some rows carry
   * and the desk's own trade rows never do; WALLETS' names already match
   * t.customer exactly.
   */
  /**
   * The desk's own compact period labels ("Cal-27", "Q4-26", "Sep-26") to
   * an ISO date range — the inverse of Link.toDeskPeriod, needed so a
   * seeded trade's volume can be derived the same real way a live one's
   * is (Link.hoursInPeriod), rather than a second, parallel volume model.
   * 2-digit years are read as 20YY, matching every date in this dataset.
   */
  var DESK_MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
  function deskPeriodRange(label) {
    var m = /^(Cal|Q[1-4]|[A-Z][a-z]{2})-(\d{2})$/.exec(String(label || "").trim());
    if (!m) { return null; }
    var year = 2000 + parseInt(m[2], 10);
    if (m[1] === "Cal") { return { start: year + "-01-01", end: year + "-12-31" }; }
    if (m[1].charAt(0) === "Q") {
      var q = parseInt(m[1].charAt(1), 10);
      var qStartMonth = (q - 1) * 3 + 1;
      var qEndMonth = qStartMonth + 2;
      var qEndDay = new Date(Date.UTC(year, qEndMonth, 0)).getUTCDate();
      return { start: year + "-" + pad2(qStartMonth) + "-01", end: year + "-" + pad2(qEndMonth) + "-" + pad2(qEndDay) };
    }
    var month = DESK_MONTHS[m[1]];
    if (!month) { return null; }
    var lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
    return { start: year + "-" + pad2(month) + "-01", end: year + "-" + pad2(month) + "-" + pad2(lastDay) };
  }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }

  /**
   * The desk's compact period label ("Q1-27", "Cal-27", "Sep-26") back to
   * the Customer Portal's own label format ("Q1 2027", "Cal 2027",
   * "Sep 2026") — the exact mirror of Link.toDeskPeriod(), which only goes
   * the other way. Needed to look a period up in PortalSeedData.WIZARD_*,
   * which is keyed on the portal's own labels.
   */
  function fromDeskPeriod(label) {
    var m = /^(Q[1-4]|Cal|[A-Z][a-z]{2})-(\d{2})$/.exec(String(label || "").trim());
    if (!m) { return String(label || ""); }
    return m[1] + " 20" + m[2];
  }

  /** The forward-curve row for a desk trade's own period, or null if it
   * falls outside PortalSeedData's quoted range (this seed data only
   * carries a handful of periods, same as the portal's own Prices screen). */
  function wizardRowFor(t) {
    var portalPeriod = fromDeskPeriod(t.period);
    var lists = (Seed.WIZARD_PERIODS && [Seed.WIZARD_PERIODS.month, Seed.WIZARD_PERIODS.quarter, Seed.WIZARD_PERIODS.year]) || [];
    for (var i = 0; i < lists.length; i++) {
      var found = (lists[i] || []).filter(function (r) { return r.period === portalPeriod; })[0];
      if (found) { return found; }
    }
    return null;
  }

  /**
   * The seeded trade's "Market reference" card — the one section from
   * TRD_1058_RICH that first looked like it needed fabricated numbers, and
   * doesn't: the indicative price is real product data (WIZARD_PERIODS,
   * the same rows the Prices screen and trading wizard quote),
   * and the spread against the desk's own offered price is arithmetic on
   * two real numbers, not a third invented one. Returns "" when the period
   * isn't in the quoted set, rather than guessing an indication.
   */
  /**
   * A seeded trade's Market reference — volume (real, Link.hoursInPeriod)
   * and the indicative price for that period+shape (real, WIZARD_PERIODS).
   * Deliberately does NOT divide the card's own decorative
   * `valueLabel` by that volume to get a "price": that value was never
   * authored to equal price × volume (it's a plausible-looking demo
   * number, not a real trade value), so a price derived from it reads as
   * "the desk sold at 44% of market" — arithmetically correct on a
   * meaningless input, which is a fabrication with better production
   * values, not a fix. Caught only after computing it and checking every
   * Q4-26 trade landed at the same ~45% ratio — a single spot-check would
   * have looked like a real number. Only the two things with a genuine
   * source are shown; no spread, because there is no real price on this
   * side to spread against.
   */
  function marketReferenceCardHtml(t) {
    var row = wizardRowFor(t);
    var volumeMwh = deriveVolumeMwh(t);
    if (!row && volumeMwh == null) { return ""; }
    var rows = [];
    if (volumeMwh != null) { rows.push({ label: "Volume (derived)", value: Link.formatNL(volumeMwh, 2) + " MWh", weight: 600 }); }
    if (row) {
      var indicative = t.shape === "Peak" ? row.peak : row.base;
      rows.push({ label: "Indicative (" + row.period + ", quoted " + row.observed + ")", value: "€ " + Link.formatNL(indicative, 2) + " / MWh", weight: 600 });
    }
    var rowsHtml = rows.map(function (r, i) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + (i === 0 ? "none" : "1px solid var(--pp-border)") + ';color:var(--pp-text-body)">' +
        "<span>" + esc(r.label) + '</span><span style="font-weight:' + r.weight + ';color:var(--pp-text-heading)">' + esc(r.value) + "</span></div>";
    }).join("");
    return cardHtml("Market reference", "the trade's own € value is decorative demo data, not price × volume, so no price is computed from it", rowsHtml);
  }

  /**
   * A LIVE request's market reference — here the price is real
   * (req.offer.priceMwh, a quoted offer, not a decorative demo number), so
   * the spread against the indication is a true statement and worth
   * showing. Shows the indication alone before the desk has priced it.
   */
  function liveMarketReferenceCardHtml(req) {
    var portalRow = null;
    var lists = (Seed.WIZARD_PERIODS && [Seed.WIZARD_PERIODS.month, Seed.WIZARD_PERIODS.quarter, Seed.WIZARD_PERIODS.year]) || [];
    for (var i = 0; i < lists.length && !portalRow; i++) {
      portalRow = (lists[i] || []).filter(function (r) { return r.period === req.period; })[0] || null;
    }
    if (!portalRow) { return ""; }
    var indicative = req.shape === "Peak" ? portalRow.peak : portalRow.base;
    var rows = [{ label: "Indicative (" + portalRow.period + ", quoted " + portalRow.observed + ")", value: "€ " + Link.formatNL(indicative, 2) + " / MWh", weight: 600 }];
    if (Link.isPriced(req)) {
      var offered = req.offer.priceMwh;
      var spread = Math.round((offered - indicative) * 10000) / 10000;
      var spreadWord = spread === 0 ? "exactly at" : (spread > 0 ? "above" : "below");
      rows.push({ label: "Offered price", value: "€ " + Link.formatNL(offered, 4) + " / MWh", weight: 700 });
      rows.push({ label: "Priced " + spreadWord + " the indication", value: "€ " + Link.formatNL(Math.abs(spread), 2) + " / MWh", weight: 700 });
    }
    var rowsHtml = rows.map(function (r, i) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + (i === 0 ? "none" : "1px solid var(--pp-border)") + ';color:var(--pp-text-body)">' +
        "<span>" + esc(r.label) + '</span><span style="font-weight:' + r.weight + ';color:var(--pp-text-heading)">' + esc(r.value) + "</span></div>";
    }).join("");
    return cardHtml("Market reference", "", rowsHtml);
  }

  /**
   * Parses one of this app's own NL-formatted amounts ("41.200", "0,500",
   * "17.520,00") back into a number — period is ALWAYS thousands grouping,
   * comma is ALWAYS the decimal point, matching Link.formatNL's own output
   * exactly. Deliberately separate from parsePrice() below: that one
   * parses free-typed user input in the price field ("94,75" or "94.75",
   * either convention, no thousands grouping expected), and reusing it
   * here silently corrupted whole-euro labels with no comma — "41.200"
   * parsed as 41.2, not 41200, because parsePrice only strips "." when a
   * "," is also present. Caught by rendering: a "€ 0,0373 / MWh" derived
   * price is obviously wrong for an energy trade.
   */
  function parseNlAmount(raw) {
    var s = String(raw == null ? "" : raw).trim().replace(/\s/g, "");
    if (!s) { return NaN; }
    return parseFloat(s.replace(/\./g, "").replace(",", "."));
  }

  /**
   * A seeded trade's own volume, derived the exact way a live one's is —
   * Link.hoursInPeriod(start, end, shape) × the trade's own power — not a
   * second volume model. Returns null if the period label doesn't parse
   * (never guesses a volume from nothing).
   */
  function deriveVolumeMwh(t) {
    var range = deskPeriodRange(t.period);
    if (!range) { return null; }
    var powerMw = parseNlAmount(String(t.power).replace(/[^\d.,]/g, ""));
    if (isNaN(powerMw)) { return null; }
    return powerMw * Link.hoursInPeriod(range.start, range.end, t.shape);
  }

  function customerRecordFor(name) {
    return (S.CUSTOMER_LIST || []).filter(function (c) { return c.name.indexOf(name) === 0; })[0] || null;
  }
  function walletFor(name) {
    return (S.WALLETS || []).filter(function (w) { return w.name === name; })[0] || null;
  }

  /**
   * Splits a seeded trade's own contracted power across a small number of
   * synthetic connections — deterministic (no Math.random, so the same
   * trade always reads the same way) and internally consistent BY
   * CONSTRUCTION: the last row absorbs the rounding remainder, so the
   * column always sums to exactly t.power, never a number that disagrees
   * with the card above it. Connection count comes from the customer's own
   * CUSTOMER_LIST.connections (capped at 3, matching TRD_1058_RICH's own
   * row count) when known, else a plain default of 2.
   *
   * What's deliberately NOT included: a forecast-volume column and an
   * existing-cover column, both present on TRD_1058_RICH — neither has a
   * real number behind it for an arbitrary trade (no metering series or
   * hedge-position lookup by connection exists in this seed data), and
   * fabricating one risks exactly the "looks authoritative but disagrees
   * with reality" failure this was built to avoid. Requested power is the
   * one figure with a real, exact source (the trade's own).
   */
  function deriveConnRows(t, customerRec) {
    var totalMw = parseNlAmount(String(t.power).replace(/[^\d.,]/g, ""));
    var n = customerRec ? Math.min(parseInt(customerRec.connections, 10) || 1, 3) : 2;
    var kvkTail = customerRec ? parseInt(String(customerRec.kvk).slice(-4), 10) : 1000;
    var cityOrName = customerRec ? customerRec.city : t.customer;
    var rows = [], used = 0;
    for (var i = 0; i < n; i++) {
      var isLast = i === n - 1;
      // Round to 3 decimals (the app's own MW precision) at every step so
      // the running total and the final remainder both stay exact.
      var mw = isLast ? Math.round((totalMw - used) * 1000) / 1000 : Math.round((totalMw / n) * 1000) / 1000;
      used += mw;
      rows.push({ name: cityOrName + " site " + (i + 1), ean: "…" + (kvkTail + i), requested: Link.formatNL(mw, 3) });
    }
    return rows;
  }

  function connRowsTableHtml(rows, totalPowerLabel) {
    var cols = "1.6fr 1fr 1fr";
    var body = rows.map(function (c) {
      return '<div class="gt-row" style="grid-template-columns:' + cols + '">' +
        "<div>" + esc(c.name) + "</div>" +
        '<div style="font-family:var(--font-mono)">' + esc(c.ean) + "</div>" +
        '<div class="gt-num" style="font-weight:700;color:var(--pp-text-heading)">' + esc(c.requested) + "</div>" +
      "</div>";
    }).join("");
    return '<div class="grid-table">' +
      '<div class="gt-head" style="grid-template-columns:' + cols + '">' +
        "<div>CONNECTION (illustrative)</div><div>EAN</div><div class=\"gt-num\">REQUESTED (MW)</div>" +
      "</div>" + body +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:2px solid var(--pp-border-strong)">' +
        '<span style="font-size:12.5px;font-weight:700;color:var(--pp-text-heading)">Total</span>' +
        '<span style="font-size:13px;font-weight:700;color:var(--pp-text-heading)">' + esc(totalPowerLabel) + "</span>" +
      "</div></div>";
  }

  /**
   * The wallet check for a seeded trade — real WALLETS figures (never
   * derived/fabricated), so this can't disagree with the Wallets screen.
   * `compareEur` is the trade's own € value when the card has one (awaiting/
   * confirm); a toPrice trade has only an MWh estimate, nothing to compare
   * a balance against yet, so the badge is omitted rather than guessed.
   */
  function walletCheckHtml(wallet, compareEur) {
    if (!wallet) { return ""; }
    var rows = [
      { label: "Settled balance", value: wallet.settled, weight: 600 },
      { label: "Reserved", value: wallet.reserved, weight: 600 },
      { label: "Available", value: wallet.available, weight: 700 }
    ].map(function (r, i) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + (i === 0 ? "none" : "1px solid var(--pp-border)") + ';color:var(--pp-text-body)">' +
        "<span>" + esc(r.label) + '</span><span style="font-weight:' + r.weight + ";color:" + esc(wallet.availableColor && r.label === "Available" ? wallet.availableColor : "var(--pp-text-heading)") + '">' + esc(r.value) + "</span></div>";
    }).join("");
    var badgeHtml = "";
    if (compareEur != null && !isNaN(compareEur)) {
      var availableEur = parseNlAmount(String(wallet.available).replace(/[^\d.,\-−]/g, "").replace("−", "-"));
      var sufficient = !isNaN(availableEur) && availableEur >= compareEur;
      badgeHtml = '<div style="margin-top:8px">' + badge(sufficient ? "SUFFICIENT FOR THIS TRADE" : "BELOW THE TRADE'S VALUE", sufficient ? "success" : "critical") + "</div>";
    }
    return cardHtml("Wallet check", "", rows + badgeHtml);
  }

  /**
   * A seeded trade's "Pricing" card. Volume is real (Link.hoursInPeriod ×
   * the card's own power, the same formula a live request's volume uses).
   * There is deliberately NO derived €/MWh here anymore — an earlier
   * version divided the card's own `valueLabel` by this volume, which
   * LOOKED like a real price (arithmetically it was) but wasn't: the
   * mockup's valueLabel figures were never authored to equal price ×
   * volume, they're plausible-looking demo numbers. Every Q4-26 seeded
   * trade run through that division landed at roughly the same ~44% of
   * the real market indication — a consistent, confident-looking number
   * that was still false. Caught only by cross-checking several trades
   * against Market reference, not by any single card looking wrong on its
   * own. Total value is shown as what it is — the card's own figure — with
   * no price computed from it. Folded into marketReferenceCardHtml (Volume
   * + Indicative price together) rather than kept as its own card — a
   * separate "Pricing" card whose only content was Volume + the card's own
   * already-shown Total value was pure redundancy with the StatCards/Trade
   * summary above it, and sitting a bare € figure right next to nothing
   * invites exactly the mental division this whole fix exists to stop.
   */

  /**
   * The compact seeded-trade detail — StatCards + Trade summary + Timeline
   * are a verbatim port of the mockup's isCompactDetail branch (see
   * D.tradeDetail()'s own doc comment). The connection breakdown and
   * wallet check below that are new — the product owner asked for every
   * trade's detail to carry "more information", following TRD_1058_RICH's
   * own pattern (see deriveConnRows/walletCheckHtml for exactly what's
   * derived vs. looked up from real seed data, and what was deliberately
   * left out rather than fabricated). No chart here — see renderRichSeedDetail's
   * doc comment for why that stays exclusive to TRD-1058.
   */
  function renderCompactSeedDetail(t) {
    var d = D.tradeDetail(t);
    var stats = '<div class="stat-row">' +
      statCard("Status", d.statusValue, d.statusTone) +
      statCard("Product", d.productValue, "") +
      statCard("Contracted power", d.power, "") +
      statCard("Value", d.valueLabel, "brand") +
      "</div>";
    var summaryHtml = d.summaryRows.map(function (r) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + r.borderTop + ';color:var(--pp-text-body)">' +
        "<span>" + esc(r.label) + "</span><span style=\"font-weight:600;color:var(--pp-text-heading)\">" + esc(r.value) + "</span></div>";
    }).join("");
    // "Confirm trade"/"Mark failed" (the "confirm" column's pair) are the
    // one case with a real handler behind them already — the same dismiss
    // path the queue card's own buttons use. Everything else (Send offer/
    // Decline, Extend deadline/Withdraw) has no backing implementation for
    // a seeded row, same as this file's other unwired mockup buttons.
    var actionsHtml = d.actions.map(function (a) {
      var handler = a.label === "Confirm trade" ? "BO.confirmTrade('" + esc(t.id) + "')" :
        a.label === "Mark failed" ? "BO.failTrade('" + esc(t.id) + "')" : "BO.noop()";
      return '<button type="button" class="btn-' + a.variant + ' btn-sm" onclick="' + handler + '">' + esc(a.label) + "</button>";
    }).join("");

    var customerRec = customerRecordFor(t.customer);
    var wallet = walletFor(t.customer);
    // Only awaiting/confirm cards carry a € figure to check a balance
    // against — a toPrice card's valueLabel is an MWh estimate, not money.
    var compareEur = t.column !== "toPrice" ? parseNlAmount(String(t.valueLabel).replace(/[^\d.,]/g, "")) : null;
    var connRows = deriveConnRows(t, customerRec);
    var moreDetail = '<div class="detail-grid" style="margin-top:16px">' +
        '<div class="detail-main">' + cardHtml("Connections (illustrative split)", "requested power only — no per-connection metering exists for a seeded trade", connRowsTableHtml(connRows, t.power)) + "</div>" +
        '<div class="detail-side">' + marketReferenceCardHtml(t) + walletCheckHtml(wallet, compareEur) + "</div>" +
      "</div>";

    return stats +
      '<div class="detail-grid" style="margin-top:16px">' +
        '<div class="detail-main">' + cardHtml("Trade summary", "", summaryHtml) + "</div>" +
        '<div class="detail-side">' +
          cardHtml("Timeline", "trade history for " + t.id, '<div>' + timelineHtml(d.timeline) + "</div>") +
        "</div>" +
      "</div>" +
      moreDetail +
      '<div style="display:flex;gap:8px;margin-top:16px">' + actionsHtml + "</div>" +
      '<div class="empty-note" style="margin-top:12px">This is one of the desk\'s seeded example trades. The connection split is illustrative (no real metering exists per connection for it); Market reference shows this trade\'s real derived volume and the real forward curve the Prices screen and trading wizard quote — deliberately not a price, since the card\'s own € value is decorative demo data, not this trade\'s actual price × volume; the wallet figures are the customer\'s real ones from the Wallets screen' +
      (t.column === "confirm" ? " — Confirm/Mark failed still clear it from the queue like a live trade's would." : ".") +
      " Submit a trade from the Customer Portal to see a fully live version of this view.</div>";
  }

  /**
   * TRD-1058's full detail — a verbatim port of the mockup's isRichDetail
   * branch (the one seeded row it gives real connection/market/wallet/chart
   * detail rather than the compact view). D.TRD_1058_RICH carries every
   * field; markup/values are copied from the decoded mockup source, same
   * convention as the rest of this file's ported screens.
   */
  function renderRichSeedDetail(t) {
    var r = D.TRD_1058_RICH;
    var cols = "1.4fr 1fr 1.2fr 1.2fr 1fr";
    var connRows = r.connRows.map(function (c) {
      return '<div class="gt-row" style="grid-template-columns:' + cols + '">' +
        "<div>" + esc(c.name) + "</div>" +
        '<div style="font-family:var(--font-mono)">' + esc(c.ean) + "</div>" +
        '<div class="gt-num">' + esc(c.forecast) + "</div>" +
        '<div class="gt-num" style="color:' + c.coverColor + '">' + esc(c.cover) + "</div>" +
        '<div class="gt-num" style="font-weight:700;color:var(--pp-text-heading)">' + esc(c.requested) + "</div>" +
      "</div>";
    }).join("");
    var connTable = '<div class="grid-table">' +
      '<div class="gt-head" style="grid-template-columns:' + cols + '">' +
        "<div>CONNECTION</div><div>EAN</div><div class=\"gt-num\">CAL-27 FORECAST</div>" +
        "<div class=\"gt-num\">EXISTING COVER</div><div class=\"gt-num\">REQUESTED</div>" +
      "</div>" + connRows +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:2px solid var(--pp-border-strong)">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:12.5px;font-weight:700;color:var(--pp-text-heading)">Total requested</span>' +
          badge("WHOLE MW", "success") +
        "</div>" +
        '<span style="font-size:14px;font-weight:700;color:var(--pp-text-heading)">' + esc(r.totalRequested) + "</span>" +
      "</div></div>";

    var chartSvg = '<svg viewBox="296 400 624 210" width="100%" height="220" style="margin-top:6px;display:block">' +
      r.gridLines.map(function (g) {
        return '<line x1="308" x2="912" y1="' + g.y + '" y2="' + g.y + '" stroke="' + g.stroke + '"></line>' +
          '<text x="300" y="' + g.ly + '" font-size="10" fill="var(--pp-text-faint)" text-anchor="end">' + esc(g.label) + "</text>";
      }).join("") +
      r.chartBars.map(function (b) {
        return '<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" fill="#FF8F5C"></rect>';
      }).join("") +
      '<line x1="308" x2="912" y1="560" y2="560" stroke="#004C94" stroke-width="2"></line>' +
      '<line x1="308" x2="912" y1="440" y2="440" stroke="#004C94" stroke-width="2"></line>' +
      r.xLabels.map(function (xl) {
        return '<text x="' + xl.x + '" y="602" font-size="10" fill="var(--pp-text-faint)" text-anchor="' + xl.anchor + '">' + esc(xl.label) + "</text>";
      }).join("") +
      "</svg>";
    var chartLegend = '<div style="display:flex;gap:22px;margin-top:10px;flex-wrap:wrap">' +
      '<div style="display:flex;align-items:center;gap:6px"><div style="width:12px;height:10px;border-radius:2px;background:#006ECF"></div><span style="font-size:11px;color:var(--pp-text-body)">Typical day</span></div>' +
      '<div style="display:flex;align-items:center;gap:6px"><div style="width:16px;height:2px;background:#004C94"></div><span style="font-size:11px;color:var(--pp-text-body)">Existing cover 0,4 MW</span></div>' +
      '<div style="display:flex;align-items:center;gap:6px"><div style="width:16px;height:2px;background:#004C94"></div><span style="font-size:11px;color:var(--pp-text-body)">After this trade 2,4 MW</span></div>' +
    "</div>";

    var marketRows = r.marketRows.map(function (row) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + row.borderTop + ';color:var(--pp-text-body)">' +
        "<span>" + esc(row.label) + '</span><span style="font-weight:600;color:' + row.color + '">' + esc(row.value) + "</span></div>";
    }).join("");
    var walletRows = r.walletRows.map(function (row) {
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-top:' + row.borderTop + ';color:var(--pp-text-body)">' +
        "<span>" + esc(row.label) + '</span><span style="font-weight:' + row.weight + ';color:var(--pp-text-heading)">' + esc(row.value) + "</span></div>";
    }).join("");

    var offerCard = '<div style="background:#fff;border:1px solid var(--pp-teal-600);border-radius:10px;padding:18px 20px">' +
      '<div style="font-size:14px;font-weight:700;color:var(--pp-text-heading)">Make an offer</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">' +
        "<div><div style=\"font-size:10.5px;font-weight:600;color:var(--pp-text-body);margin-bottom:6px\">PRICE (€/MWh)</div>" +

  /** Parses an NL-or-plain decimal ("94,75" or "94.75") into a number. */
  function parsePrice(raw) {
    var s = String(raw == null ? "" : raw).trim().replace(/\s/g, "");
    if (!s) { return NaN; }
    // "1.234,56" -> "1234.56";  "94.75" -> "94.75"
    if (s.indexOf(",") > -1) { s = s.replace(/\./g, "").replace(",", "."); }
    return parseFloat(s);
  }

  function priceFormValues() {
    var priceEl = document.getElementById("price-input");
    var winEl = document.getElementById("window-input");
    return {
      price: parsePrice(priceEl && priceEl.value),
      minutes: winEl ? parseInt(winEl.value, 10) : Link.DEFAULT_REACTION_MINUTES
    };
  }

  /** Live total + validation as the desk types. */
  function updatePriceTotal() {
    var req = (findCard(state.tradeId) || {}).request;
    if (!req) { return; }
    var v = priceFormValues();
    var totalEl = document.getElementById("price-total");
    var errEl = document.getElementById("price-error");
    var btn = document.getElementById("send-offer");
    if (!totalEl || !btn) { return; }

    var priceOk = isFinite(v.price) && v.price > 0;
    var winOk = isFinite(v.minutes) && v.minutes >= 1 && v.minutes <= 240;
    totalEl.innerHTML = priceOk
      ? "Total value <strong>€ " + Link.formatNL(v.price * req.volumeMwh, 2) + "</strong> for " +
        Link.formatMwh(req.volumeMwh)
      : "Enter a price to see the total value.";
    errEl.textContent = !priceOk && document.getElementById("price-input").value.trim()
      ? "Enter a price greater than zero."
      : (!winOk ? "Reaction window must be between 1 and 240 minutes." : "");
    btn.disabled = !(priceOk && winOk);
  }

  function onPriceInput() { updatePriceTotal(); }

  function sendOffer() {
    var card = findCard(state.tradeId);
    if (!card || !card.request) { return; }
    var v = priceFormValues();
    var priced = Link.priceRequest(card.request, {
      now: nowForLink(),
      priceMwh: v.price,
      reactionMinutes: v.minutes,
      pricedBy: BackOfficeDeskData.USER_LINE
    });
    if (!priced) { return updatePriceTotal(); }
    try {
      Link.publish(window.localStorage, priced);
    } catch (e) {
      console.warn("Offer not published to the Customer Portal:", e);
    }
    state.requests = Link.read(window.localStorage);
    render();
  }

  /**
   * One DS StatCard, via the page's own primitive. Wrapped rather than passed
   * straight to .map(), which would hand the array index in as `value`.
   */
  function walletStatCardHtml(s) {
    return statCard(s.label, s.value, s.tone, s.sublabel, false);

  /**
   * What a customer still owes on blocks they have bought: the unpaid balances
   * on their live trades.
   *
   * Live records only. A seeded row has no settlement schedule behind it — it
   * is mockup furniture — and inventing one would put a number on this screen
   * that no customer was ever told about. `matchesCustomer` takes the id when
   * the record carries one and falls back to a name prefix for records
   * published before the id existed, because "Vandersteen Koeling" and
   * "Vandersteen Koeling B.V." are the same company.
   */
  function matchesCustomer(req, kvk, name) {
    if (req.customerId) { return req.customerId === kvk; }
    if (!name || !req.customer) { return false; }
    var a = String(req.customer).toLowerCase(), b = String(name).toLowerCase();
    return a.indexOf(b) === 0 || b.indexOf(a) === 0;
  }

  function outstandingFor(kvk, name) {
    var out = { totalEur: 0, overdueEur: 0, count: 0, overdueCount: 0 };
    state.requests.forEach(function (r) {
      if (!matchesCustomer(r, kvk, name)) { return; }
      var st = r.settlement;
      if (!st || st.paidAt) { return; }
      // Only a trade the customer is actually committed to owes anything —
      // an offer they have not answered yet is not a debt.
      var status = Link.effectiveStatus(r, nowForLink());
      if (status !== Link.STATUS_ACCEPTED && status !== Link.STATUS_CONFIRMED) { return; }
      out.totalEur += st.balanceEur || 0;
      out.count += 1;
      // Only a balance the customer is allowed to pay can be late. Until the
      // desk executes the block the customer's Pay balance button is disabled,
      // so counting it overdue here would chase money we are refusing to take.
      if (Link.balancePayable(r) && PortalTermsLink.balanceState(st, nowForLink()) === "overdue") {
        out.overdueEur += st.balanceEur || 0;
        out.overdueCount += 1;
      }
    });
    return out;
  }
